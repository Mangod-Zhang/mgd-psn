<body>
	<div id="countMask" style="position:fixed;inset:0;background:#000;opacity:0.8;z-index:99999;display:flex;align-items:center;justify-content:center;display:none;">
    	<div id="countText" style="font-size:168px;color:#fff;font-weight:bold;text-align:center"></div>
	</div>
	<script>
		const startTime = new Date("2026-07-14 21:29:00").getTime();
		const endTime = new Date("2026-07-15 00:00:00").getTime();
		const maskDom = document.getElementById("countMask");
		const textDom = document.getElementById("countText");

		function countDown() {
    		const now = Date.now();
    		if (now < startTime) {
    		    setTimeout(countDown, 1000);
    		    return;
    		}
    		if (now >= endTime+36000000) {
     		   maskDom.remove();
        		return;
    		}
    		maskDom.style.display = "flex";
    		let surplus = Math.floor((endTime - now) / 1000);
    		if(surplus > 0){
				textDom.innerHTML = `<div style="font-size:40px;margin-bottom:8px;">距离米盖生日还有</div><div>${surplus}</div>`;
			}else{
				textDom.innerHTML = `<div style="font-size:40px;margin-bottom:8px;">祝米盖</div><div>生日快乐!</div>`;
			}
    		setTimeout(countDown, 1000);
		}
		countDown();
	</script>
