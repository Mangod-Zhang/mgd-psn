	<style>
        body {
            background-color: #f0f0f0; /* 这里改颜色 */
			color: #555;
        }
		*{margin:0;padding:0;box-sizing:border-box;font-family:SimHei,Microsoft YaHei}
		.box{
  			width: 600px;
  			border: 2px solid #000;
  			border-radius: 6px;
  			overflow: visible;
		}
		.box-header{
  			background:#000;
  			color:#fff;
  			display:flex;
  			justify-content: space-between;
  			align-items: center;
  			padding:40px 16px;
  			position:relative;
		}
		.role-list{
  			padding:48px 16px;
		}
		/* 链接基础样式 + 定位给悬浮图用 */
		.role-list a{
			text-decoration:none;
  			font-size:24px;
  			line-height:2;
  			color:#8b0000;
			position: relative;
			display: inline-block;
			width: 100%;
			padding-bottom: 12px;
			border-bottom: 1px solid #ccc; /* 分隔线 */
			margin-bottom: 12px;
		}
		.role-list a:hover{
  			font-size:40px;
  			line-height:2.2;
  			color:#ac0000;
		}
		/* 悬浮预览图默认隐藏 */
		.preview-img{
			display: none;
			position: absolute;
			left: 85%; /* 贴在文字右侧 */
			top: -10px;
			width: 110px;
			border-radius: 50%;
			box-shadow: 0 3px 12px rgba(0,0,0,0.2);
			z-index: 9999;
		}
		/* 悬浮链接时显示图片 */
		.role-list a:hover .preview-img{
			display: block;
		}
	</style>
</head>
