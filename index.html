    <h2 id="countdown" style="text-align: center"></h2>

	<script>
		function updateTime() {
    		const now = new Date();
    		let target = new Date(now.getFullYear(), 5, 7, 0, 0, 0);
    		if (target < now) {
    		    target = new Date(now.getFullYear() + 1, 5, 7, 0, 0, 0);
    		}
    		let diff = target - now;
    		const day = Math.floor(diff / (1000 * 60 * 60 * 24));
    		diff %= 1000 * 60 * 60 * 24;
    		const hour = Math.floor(diff / (1000 * 60 * 60));
    		diff %= 1000 * 60 * 60;
    		const minute = Math.floor(diff / (1000 * 60));
    		diff %= 1000 * 60;
    		const second = Math.floor(diff / 1000);
    		if(day != 364) document.getElementById('countdown').innerText = `距离MGD生日还有：${day}天 ${hour}小时 ${minute}分 ${second}秒`;
			else document.getElementById('countdown').innerText = `祝MGD 生日快乐！`;
		}
		updateTime();
		setInterval(updateTime, 1000);
	</script>
	<div id="countMask" style="position:fixed;inset:0;background:#000;opacity:0.8;z-index:99999;display:flex;align-items:center;justify-content:center;display:none;">
    	<div id="countText" style="font-size:324px;color:#fff;font-weight:bold;text-align:center"></div>
	</div>

	<script>
		const startTime = new Date("2026-06-06 21:30:00").getTime();
		const endTime = new Date("2026-06-07 00:00:00").getTime();
		const maskDom = document.getElementById("countMask");
		const textDom = document.getElementById("countText");

		function countDown() {
    		const now = Date.now();
    		if (now < startTime) {
    		    setTimeout(countDown, 1000);
    		    return;
    		}
    		if (now >= endTime+60000) {
     		   maskDom.remove();
        		return;
    		}
    		maskDom.style.display = "flex";
    		let surplus = Math.floor((endTime - now) / 1000);
    		if(surplus > 0){
				textDom.innerHTML = `<div style="font-size:40px;margin-bottom:8px;">距离MGD生日还有</div><div>${surplus}</div>`;
				if(surplus == 729){
					textDom.innerHTML = `<div style="font-size:40px;margin-bottom:8px;">距离MGD生日还有</div><div>ki729</div>`;
				}
				if(surplus == 2745){
					textDom.innerHTML = `<div style="font-size:40px;margin-bottom:8px;">距离MGD生日还有</div><div>2745(99)</div>`;
				}
			}else{
				textDom.innerHTML = `<div style="font-size:40px;margin-bottom:8px;">祝MGD</div><div>生日快乐!</div>`;
			}
    		setTimeout(countDown, 1000);
		}
		countDown();
	</script>
