var debugKeyTimer = null;
document.addEventListener('keydown', function(e) {
    if (e.key === 'F3') {
        debugKeyActive = true;
        if (debugKeyTimer) clearTimeout(debugKeyTimer);
        debugKeyTimer = setTimeout(function() { debugKeyActive = false; debugKeyTimer = null; }, 1500);
        e.preventDefault();
        return;
    }
    if ((e.key === 'm' || e.key === 'M') && debugKeyActive) {
        DEBUG_AI_SCORES = !DEBUG_AI_SCORES;
        if (G && !G.finished) G.addLog(DEBUG_AI_SCORES ? '[调试] AI评分输出已开启' : '[调试] AI评分输出已关闭');
        debugKeyActive = false;
        if (debugKeyTimer) { clearTimeout(debugKeyTimer); debugKeyTimer = null; }
        e.preventDefault();
    }
});

// =====================================================================
// 游戏核心类
// =====================================================================
class Game {
    constructor(width, height, playersConfig, R) {
        this.W = width; this.H = height; this.R = R;
        this.players = [];
        this.turn = 0;
        this.finished = false;
        this.waitingForHuman = false;
        this.turnOrder = [];
        this.fixedTurnOrder = [];
        this.humanOrderIdx = -1;
        this.currentActingPlayer = -1;
        this.pendingConfirm = false;
        this.simulationMode = false;
        this.grid = [];
        for (var y=0; y<this.H; y++) {
            this.grid[y] = [];
            for (var x=0; x<this.W; x++) this.grid[y][x] = { owner: -1, troops: 0, capitalOf: -1 };
        }
        for (var i=0; i<playersConfig.length; i++) {
            var cfg = playersConfig[i];
            this.players.push({
                id: i, human: cfg.human || false, name: cfg.name || ('AI-' + i),
                color: cfg.color || '#888', troops: 100, atkRange: 0, defRange: 0,
                capital: null, territories: [],
                relations: Array(playersConfig.length).fill(0),
                cooldown: Array(playersConfig.length).fill(0),
                Agg: cfg.Agg || 0.5, Exp: cfg.Exp || 0.5, Tech: cfg.Tech || 0.5,
                Soc: cfg.Soc || 0.5, Cau: cfg.Cau || 0.5,
                alive: true, capitalCooldown: 0
            });
        }
        var positions = [];
        for (var y=0; y<this.H; y++) for (var x=0; x<this.W; x++) positions.push({x:x,y:y});
        for (var i=positions.length-1; i>0; i--) {
            var j = rand(0,i);
            var t = positions[i]; positions[i] = positions[j]; positions[j] = t;
        }
        for (var i=0; i<this.players.length; i++) {
            var pos = positions[i];
            this.players[i].capital = {x:pos.x, y:pos.y};
            this.grid[pos.y][pos.x].owner = i;
            this.grid[pos.y][pos.x].troops = 100;
            this.grid[pos.y][pos.x].capitalOf = i;
            this.players[i].territories.push({x:pos.x, y:pos.y});
        }
        this.fixedTurnOrder = this.players.map(function(p) { return p.id; });
        for (var i = this.fixedTurnOrder.length - 1; i > 0; i--) {
            var j = rand(0, i);
            var t = this.fixedTurnOrder[i]; this.fixedTurnOrder[i] = this.fixedTurnOrder[j]; this.fixedTurnOrder[j] = t;
        }
        this.addLog('游戏开始，' + playersConfig.length + '位玩家。');
        this.updateStatusBar();
    }

    serialize() {
        return {
            W: this.W, H: this.H, R: this.R,
            turn: this.turn, finished: this.finished,
            waitingForHuman: this.waitingForHuman, pendingConfirm: this.pendingConfirm,
            simulationMode: this.simulationMode,
            currentActingPlayer: this.currentActingPlayer, humanOrderIdx: this.humanOrderIdx,
            fixedTurnOrder: this.fixedTurnOrder.slice(), turnOrder: this.turnOrder.slice(),
            grid: this.grid.map(function(row) { return row.map(function(c) { return { owner: c.owner, troops: c.troops, capitalOf: c.capitalOf }; }); }),
            players: this.players.map(function(p) {
                return {
                    id: p.id, human: p.human, name: p.name, color: p.color,
                    troops: p.troops, atkRange: p.atkRange, defRange: p.defRange,
                    capital: p.capital ? { x: p.capital.x, y: p.capital.y } : null,
                    territories: p.territories.map(function(t) { return { x: t.x, y: t.y }; }),
                    relations: p.relations.slice(), cooldown: p.cooldown.slice(),
                    Agg: p.Agg, Exp: p.Exp, Tech: p.Tech, Soc: p.Soc, Cau: p.Cau,
                    alive: p.alive, capitalCooldown: p.capitalCooldown
                };
            })
        };
    }

    static deserialize(data) {
        var g = Object.create(Game.prototype);
        g.W = data.W; g.H = data.H; g.R = data.R;
        g.turn = data.turn || 0;
        g.finished = !!data.finished;
        g.waitingForHuman = !!data.waitingForHuman;
        g.pendingConfirm = !!data.pendingConfirm;
        g.simulationMode = !!data.simulationMode;
        g.currentActingPlayer = (typeof data.currentActingPlayer === 'number') ? data.currentActingPlayer : -1;
        g.humanOrderIdx = (typeof data.humanOrderIdx === 'number') ? data.humanOrderIdx : -1;
        g.fixedTurnOrder = (data.fixedTurnOrder || []).slice();
        g.turnOrder = (data.turnOrder || []).slice();
        g.grid = data.grid.map(function(row) { return row.map(function(c) { return { owner: c.owner, troops: c.troops, capitalOf: c.capitalOf }; }); });
        g.players = data.players.map(function(p) {
            return {
                id: p.id, human: !!p.human, name: p.name, color: p.color,
                troops: p.troops, atkRange: p.atkRange, defRange: p.defRange,
                capital: p.capital ? { x: p.capital.x, y: p.capital.y } : null,
                territories: (p.territories || []).map(function(t) { return { x: t.x, y: t.y }; }),
                relations: (p.relations || []).slice(),
                cooldown: (p.cooldown || []).slice(),
                Agg: p.Agg, Exp: p.Exp, Tech: p.Tech, Soc: p.Soc, Cau: p.Cau,
                alive: !!p.alive, capitalCooldown: p.capitalCooldown || 0
            };
        });
        return g;
    }

    ensureCapital(pid) {
        var p = this.players[pid];
        if (!p || !p.alive) return;
        if (p.territories.length === 0) return;
        var capValid = p.capital && p.territories.some(function(t) { return t.x === p.capital.x && t.y === p.capital.y; });
        if (capValid) return;
        var best = null, bestSum = Infinity;
        for (var i = 0; i < p.territories.length; i++) {
            var t = p.territories[i];
            var sum = 0;
            for (var j = 0; j < p.territories.length; j++) sum += manhattan(t, p.territories[j]);
            if (sum < bestSum) { bestSum = sum; best = t; }
        }
        if (!best) return;
        for (var y=0; y<this.H; y++)
            for (var x=0; x<this.W; x++)
                if (this.grid[y][x].capitalOf === pid) this.grid[y][x].capitalOf = -1;
        p.capital = { x: best.x, y: best.y };
        this.grid[best.y][best.x].capitalOf = pid;
        this.addLog(cname(p) + ' 首都迁移至 (' + best.x + ',' + best.y + ')');
    }

    clearEliminatedTerritory(pid) {
        var p = this.players[pid];
        if (!p) return;
        p.territories = [];
        p.capital = null;
    }

    addLog(msg) {
        var box = document.getElementById('logBox');
        if (box) {
            box.insertAdjacentHTML('afterbegin', msg + '\n');
            box.scrollTop = 0;
        }
    }

    updateStatusBar() {
        var bar = document.getElementById('statusBar');
        if (!bar) return;
        var html = '';
        var effectiveSelected = (selectedInfoPlayer === -1) ? 0 : selectedInfoPlayer;
        for (var fi = 0; fi < this.fixedTurnOrder.length; fi++) {
            var pid = this.fixedTurnOrder[fi];
            var p = this.players[pid];
            if (!p || !p.alive) continue;
            var isYou = p.human ? ' <span class="you-tag">你</span>' : '';
            var cd = (p.id === 0 && p.capitalCooldown > 0) ? ' 迁都CD:' + p.capitalCooldown : '';
            var isActing = (this.currentActingPlayer !== -1) && (p.id === this.currentActingPlayer);
            var isSelected = (p.id === effectiveSelected);
            var borderStyle = isSelected
                ? 'border:2px solid #ffffff; box-shadow:0 0 10px rgba(255,255,255,0.6);'
                : 'border:2px solid transparent;';
            var nameStyle = isActing ? 'color:#ffdd4a; text-shadow:0 0 6px rgba(255,221,74,0.9);' : '';
            html += '<div class="status-item" style="' + borderStyle + '">' +
                '<span class="status-color" style="background:' + p.color + '"></span>' +
                '<span class="status-name" style="' + nameStyle + '">' + p.name + '</span>' + isYou +
                '<span class="status-detail">兵力:' + p.troops + ' 领土:' + p.territories.length + ' 远程攻击:' + p.atkRange + ' 远程防御:' + p.defRange + cd + '</span>' +
                '</div>';
        }
        if (tutorial.active) {
            var total = TUTORIAL_STEPS.length;
            var cur = tutorial.step + 1;
            html += '<div class="status-item tut-progress-tag">' +
                '<span class="tut-tag-title">📖 教程</span>' +
                '<span class="status-detail">第 ' + cur + ' / ' + total + ' 步</span>' +
                '</div>';
        }
        if (this.simulationMode) {
            var pauseTag = simulationPaused ? '（已暂停）' : '';
            html += '<div class="status-item" style="border:2px solid #5a4a8a; background:#2a1e3e;">' +
                '<span style="color:#a890ff; font-weight:bold;">🤖 AI 模拟' + pauseTag + '</span>' +
                '</div>';
        }
        bar.innerHTML = html;
        document.getElementById('turnDisplay').textContent = this.turn;
    }

    getCell(x,y) { if (x<0||x>=this.W||y<0||y>=this.H) return null; return this.grid[y][x]; }
    isEmpty(x,y) { var c = this.getCell(x,y); return c && c.owner === -1; }

    expand(pid, dir) {
        var p = this.players[pid];
        if (!p.alive) return false;
        var dx=0, dy=0;
        if (dir==='up') dy=-1; else if (dir==='down') dy=1; else if (dir==='left') dx=-1; else if (dir==='right') dx=1;
        else return false;
        var toAdd = [];
        for (var i = 0; i < p.territories.length; i++) {
            var t = p.territories[i];
            var nx = t.x + dx, ny = t.y + dy;
            if (nx>=0 && nx<this.W && ny>=0 && ny<this.H && this.isEmpty(nx,ny)) toAdd.push({x:nx, y:ny});
        }
        if (toAdd.length === 0) return false;
        for (var k = 0; k < toAdd.length; k++) {
            var pos = toAdd[k];
            this.grid[pos.y][pos.x].owner = pid;
            this.grid[pos.y][pos.x].troops = 0;
            this.grid[pos.y][pos.x].capitalOf = -1;
            p.territories.push({x:pos.x, y:pos.y});
        }
        this.addLog(cname(p) + ' 向' + dir + '扩张，获得 ' + toAdd.length + ' 格。');
        this.updateStatusBar();
        return true;
    }

    recruit(pid) {
        var p = this.players[pid];
        if (!p.alive) return false;
        var r = Math.random();
        var gain = 50;
        if (r < 0.4) gain = 50;
        else if (r < 0.7) gain = 100;
        else if (r < 0.9) gain = 200;
        else gain = 400;
        p.troops += gain;
        this.addLog(cname(p) + ' 征兵，获得 ' + gain + ' 兵力。');
        this.updateStatusBar();
        return gain;
    }

    research(pid, type) {
        var p = this.players[pid];
        if (!p.alive) return false;
        var inc = rand(1,5);
        if (tutorial.active && pid === 0 && type === 'attack' && tutorialForce.attackResearch5Count > 0) {
            inc = 5;
            tutorialForce.attackResearch5Count--;
        }
        if (type === 'attack') { p.atkRange += inc; this.addLog(cname(p) + ' 研发远程攻击，射程 +' + inc); }
        else if (type === 'defense') { p.defRange += inc; this.addLog(cname(p) + ' 研发远程防御，射程 +' + inc); }
        else return false;
        this.updateStatusBar();
        return inc;
    }

    relocateCapital(pid) {
        var p = this.players[pid];
        if (!p.alive || p.territories.length === 0) return false;
        if (p.capitalCooldown > 0) return false;
        var best = null, bestSum = Infinity;
        for (var i = 0; i < p.territories.length; i++) {
            var t = p.territories[i];
            var sum = 0;
            for (var j = 0; j < p.territories.length; j++) sum += manhattan(t, p.territories[j]);
            if (sum < bestSum) { bestSum = sum; best = t; }
        }
        if (!best) return false;
        if (p.capital && p.capital.x === best.x && p.capital.y === best.y) return false;
        for (var y=0; y<this.H; y++)
            for (var x=0; x<this.W; x++)
                if (this.grid[y][x].capitalOf === pid) this.grid[y][x].capitalOf = -1;
        p.capital = { x: best.x, y: best.y };
        this.grid[best.y][best.x].capitalOf = pid;
        p.capitalCooldown = 5;
        this.addLog(cname(p) + ' 迁都至 (' + best.x + ',' + best.y + ')');
        this.updateStatusBar();
        return true;
    }

    shouldRelocateCapital(pid) {
        var p = this.players[pid];
        if (!p.alive || p.capitalCooldown > 0) return false;
        if (p.territories.length <= 1) return false;
        var newCap = null, bestSum = Infinity;
        for (var i = 0; i < p.territories.length; i++) {
            var t = p.territories[i];
            var sum = 0;
            for (var j = 0; j < p.territories.length; j++) sum += manhattan(t, p.territories[j]);
            if (sum < bestSum) { bestSum = sum; newCap = t; }
        }
        if (!newCap) return false;
        var oldCap = p.capital;
        if (!oldCap) return true;
        if (oldCap.x === newCap.x && oldCap.y === newCap.y) return false;

        var self = this;
        var coverEnemies = function(cap) {
            var cnt = 0;
            for (var qi = 0; qi < self.players.length; qi++) {
                var q = self.players[qi];
                if (q.id === pid || !q.alive || p.relations[q.id] !== -1) continue;
                for (var ti = 0; ti < q.territories.length; ti++) {
                    if (manhattan(q.territories[ti], cap) <= p.atkRange) cnt++;
                }
            }
            return cnt;
        };
        var nearestEnemyDist = function(cap) {
            var minD = Infinity;
            for (var qi = 0; qi < self.players.length; qi++) {
                var q = self.players[qi];
                if (q.id === pid || !q.alive || p.relations[q.id] !== -1) continue;
                for (var ti = 0; ti < q.territories.length; ti++) {
                    var d = manhattan(q.territories[ti], cap);
                    if (d < minD) minD = d;
                }
            }
            return minD === Infinity ? 999 : minD;
        };
        var centrality = function(cap) {
            var sum = 0;
            for (var ti = 0; ti < p.territories.length; ti++) sum += manhattan(p.territories[ti], cap);
            return sum / p.territories.length;
        };

        var oldCover = coverEnemies(oldCap), newCover = coverEnemies(newCap);
        var oldSafety = nearestEnemyDist(oldCap), newSafety = nearestEnemyDist(newCap);
        var oldCentrality = centrality(oldCap), newCentrality = centrality(newCap);
        var score = (newCover - oldCover) * 10 + (newSafety - oldSafety) * 2 + (oldCentrality - newCentrality) * 1;
        return score > 15;
    }

    getAcceptProb(pid, target, type) {
        if (tutorial.active && tutorialForce.greenAcceptAlliance && pid === 0 && target === 2 && type === 'alliance') return 1;
        var p = this.players[pid], t = this.players[target];
        if (!t.alive) return 0;
        var tAgg = t.Agg, tSoc = t.Soc, tCau = t.Cau;
        if (target === 0) {
            var est = this.estimatePlayerStats();
            tAgg = est.Agg; tSoc = est.Soc; tCau = est.Cau;
        }
        var pStr = p.troops + p.atkRange * 5 + p.defRange * 3;
        var tStr = t.troops + t.atkRange * 5 + t.defRange * 3;
        var ratio = pStr / (pStr + tStr + 1);
        if (type === 'alliance') {
            var prob = 0.4 + (ratio - 0.5) * 0.8;
            if (!this.hasBorder(pid, target)) prob += 0.1;
            prob -= tAgg * 0.3; prob += tSoc * 0.3;
            return clamp(prob, 0, 1);
        } else if (type === 'peace') {
            var prob = 0.3 + (ratio - 0.5) * 0.8 + tCau * 0.2 - tAgg * 0.3;
            return clamp(prob, 0, 1);
        }
        return 0;
    }

    estimatePlayerStats() {
        var human = this.players[0];
        var allyCount = 0, hostileCount = 0;
        for (var j = 1; j < this.players.length; j++) {
            if (!this.players[j].alive) continue;
            if (human.relations[j] === 1) allyCount++;
            else if (human.relations[j] === -1) hostileCount++;
        }
        var total = Math.max(1, allyCount + hostileCount);
        return {
            Agg: clamp(0.2 + (hostileCount / total) * 0.8, 0, 1),
            Soc: clamp(0.2 + (allyCount / total) * 0.8, 0, 1),
            Cau: 0.5
        };
    }

    changeRelation(pid, target, newRel) {
        if (tutorial.active && pid !== 0 && target === 0) return false;
        var p = this.players[pid];
        var t = this.players[target];
        if (!p.alive || !t.alive) return false;
        if (p.cooldown[target] > 0) return false;
        if (newRel < -1 || newRel > 1) return false;
        if (p.relations[target] === newRel) return false;

        if (pid !== 0 && target === 0) {
            var self = this;
            if (newRel === 1) {
                diploPaused = true;
                showDiploRequest(p.name + ' 向你申请结盟，是否同意？', function() {
                    p.relations[target] = 1; t.relations[pid] = 1;
                    p.cooldown[target] = 1; t.cooldown[pid] = 1;
                    t.Soc = clamp(t.Soc + 0.1, 0, 1);
                    self.addLog('你 接受了 ' + cname(p) + ' 的结盟申请');
                    showEventPopup('🤝 你接受了 ' + p.name + ' 的结盟');
                    self.updateStatusBar(); renderGame(); diploPaused = false;
                }, function() {
                    t.Soc = clamp(t.Soc - 0.05, 0, 1);
                    self.addLog(cname(p) + ' 向你申请结盟被拒');
                    showEventPopup('❌ 你拒绝了 ' + p.name + ' 的结盟');
                    diploPaused = false;
                });
                return false;
            } else if (p.relations[target] === -1 && newRel === 0) {
                diploPaused = true;
                showDiploRequest(p.name + ' 向你请求求和，是否同意？', function() {
                    p.relations[target] = 0; t.relations[pid] = 0;
                    p.cooldown[target] = 1; t.cooldown[pid] = 1;
                    t.Agg = clamp(t.Agg - 0.1, 0, 1);
                    self.addLog('你 接受了 ' + cname(p) + ' 的求和请求');
                    showEventPopup('🕊️ 你接受了 ' + p.name + ' 的求和');
                    self.updateStatusBar(); renderGame(); diploPaused = false;
                }, function() {
                    t.Agg = clamp(t.Agg + 0.05, 0, 1);
                    self.addLog(cname(p) + ' 向你求和被拒');
                    showEventPopup('❌ 你拒绝了 ' + p.name + ' 的求和');
                    diploPaused = false;
                });
                return false;
            }
        } else {
            if (newRel === 1) {
                var prob = this.getAcceptProb(pid, target, 'alliance');
                if (Math.random() > prob) { this.addLog(cname(p) + ' 向 ' + cname(t) + ' 申请结盟被拒'); return false; }
            }
            if (p.relations[target] === -1 && newRel === 0) {
                var prob = this.getAcceptProb(pid, target, 'peace');
                if (Math.random() > prob) { this.addLog(cname(p) + ' 向 ' + cname(t) + ' 求和被拒'); return false; }
            }
        }

        p.relations[target] = newRel;
        t.relations[pid] = newRel;
        p.cooldown[target] = 1;
        t.cooldown[pid] = 1;
        var relName = {1:'同盟',0:'中立','-1':'敌对'}[newRel];
        this.addLog(cname(p) + ' 与 ' + cname(t) + ' 关系变为 ' + relName);
        this.updateStatusBar();
        return true;
    }

    hasBorder(pid1, pid2) {
        if (!this.players[pid1] || !this.players[pid2]) return false;
        var t1 = this.players[pid1].territories;
        for (var i = 0; i < t1.length; i++) {
            var a = t1[i];
            for (var d = 0; d < 4; d++) {
                var dd = [[0,1],[0,-1],[1,0],[-1,0]][d];
                var nx = a.x + dd[0], ny = a.y + dd[1];
                if (nx>=0 && nx<this.W && ny>=0 && ny<this.H && this.grid[ny][nx].owner === pid2) return true;
            }
        }
        return false;
    }

    getBorderCells(pid1, pid2) {
        var result = { pid1: [], pid2: [] };
        var t1 = this.players[pid1].territories;
        for (var i = 0; i < t1.length; i++) {
            var a = t1[i];
            for (var d = 0; d < 4; d++) {
                var dd = [[0,1],[0,-1],[1,0],[-1,0]][d];
                var nx = a.x + dd[0], ny = a.y + dd[1];
                if (nx>=0 && nx<this.W && ny>=0 && ny<this.H && this.grid[ny][nx].owner === pid2) {
                    result.pid1.push(a);
                    result.pid2.push({x:nx, y:ny});
                }
            }
        }
        return result;
    }

    getWarTotal(pid) {
        var sum = this.players[pid].troops;
        for (var k = 0; k < this.players.length; k++) {
            if (k !== pid && this.players[pid].relations[k] === 1 && this.players[k].alive) sum += this.players[k].troops * 0.5;
        }
        return sum;
    }

    prepareWarState(i, j) {
        var p1 = this.players[i], p2 = this.players[j];
        if (!p1.alive || !p2.alive) return null;
        var state = { i: i, j: j, meleeWinner: null, firstAttacker: null, secondAttacker: null };
        if (this.hasBorder(i, j)) {
            var total1 = this.getWarTotal(i), total2 = this.getWarTotal(j);
            var meleeWinner;
            if (tutorial.active && tutorialForce.blueMeleeLose && ((i === 0 && j === 1) || (i === 1 && j === 0))) {
                meleeWinner = 0;
            } else {
                meleeWinner = (Math.random() < total1 / (total1 + total2)) ? i : j;
            }
            state.meleeWinner = meleeWinner;
            state.firstAttacker = meleeWinner;
            state.secondAttacker = (meleeWinner === i) ? j : i;
        } else {
            state.firstAttacker = Math.random() < 0.5 ? i : j;
            state.secondAttacker = (state.firstAttacker === i) ? j : i;
        }
        return state;
    }

    resolveMeleePhase(state) {
        var i = state.i, j = state.j, meleeWinner = state.meleeWinner;
        if (meleeWinner === null || meleeWinner === undefined) return;
        var p1 = this.players[i], p2 = this.players[j];
        var border = this.getBorderCells(i, j);
        var loserIdx = (meleeWinner === i) ? j : i;
        var winnerP = this.players[meleeWinner];
        var loserP = this.players[loserIdx];
        var targetPositions = (meleeWinner === i) ? border.pid2 : border.pid1;
        var capturedSet = new Set();
        for (var k = 0; k < targetPositions.length; k++) {
            var pos = targetPositions[k];
            var key = pos.x + ',' + pos.y;
            if (capturedSet.has(key)) continue;
            if (this.grid[pos.y][pos.x].owner !== loserIdx) continue;
            this.grid[pos.y][pos.x].owner = meleeWinner;
            this.grid[pos.y][pos.x].troops = 0;
            this.grid[pos.y][pos.x].capitalOf = -1;
            winnerP.territories.push({ x: pos.x, y: pos.y });
            capturedSet.add(key);
        }
        if (capturedSet.size > 0) {
            loserP.territories = loserP.territories.filter(function(t) {
                return !capturedSet.has(t.x + ',' + t.y);
            });
        }
        if (meleeWinner === i) {
            this.addLog('⚔️ 近战：' + cname(p1) + ' 击败 ' + cname(p2));
        } else {
            this.addLog('⚔️ 近战：' + cname(p2) + ' 击败 ' + cname(p1));
        }
    }

    async resolveWarsAsync() {
        var n = this.players.length;
        var allPairs = [];
        for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) {
            if (this.players[i].relations[j] === -1 && this.players[i].alive && this.players[j].alive) {
                allPairs.push([i, j]);
            }
        }
        if (allPairs.length > 0) {
            var combatDelay = parseFloat(document.getElementById('combatDelaySlider').value) * 1000;
            var humanPairs = allPairs.filter(function(pair) { return pair[0] === 0 || pair[1] === 0; });
            var aiPairs = allPairs.filter(function(pair) { return pair[0] !== 0 && pair[1] !== 0; });
            var mergeOwn = document.getElementById('mergeOwnWarsCheckbox')?.checked || false;
            if (this.simulationMode) {
                aiPairs = allPairs;
                humanPairs = [];
            }
            if (aiPairs.length > 0) await this.resolveMergedWars(aiPairs, false);
            if (humanPairs.length > 0) {
                if (mergeOwn) {
                    await this.resolveMergedWars(humanPairs, true);
                } else {
                    for (var idx = 0; idx < humanPairs.length; idx++) {
                        await waitForDiplo();
                        await this.resolveWarAsync(humanPairs[idx][0], humanPairs[idx][1]);
                        if (idx < humanPairs.length - 1 && !this.finished) {
                            await new Promise(function(resolve) { setTimeout(resolve, combatDelay); });
                        }
                    }
                }
            }
        }
        for (var pi = 0; pi < this.players.length; pi++) if (this.players[pi].alive) this.ensureCapital(this.players[pi].id);
        for (var pi = 0; pi < this.players.length; pi++) {
            var p = this.players[pi];
            if (p.alive && p.territories.length === 0) {
                p.alive = false;
                this.addLog(cname(p) + ' 失去全部领土，被淘汰');
                this.clearEliminatedTerritory(p.id);
                if (p.id === 0 && !this.simulationMode) showEventPopup('💀 你失去了全部领土，被淘汰！', 5000);
            }
        }
        var alive = this.players.filter(function(p) { return p.alive; });
        if (alive.length === 1) {
            this.finished = true;
            this.addLog('🏆 ' + cname(alive[0]) + ' 获胜！');
            if (this.simulationMode) showEventPopup('🏆 ' + alive[0].name + ' 获胜！', 5000);
            else if (alive[0].id === 0) showEventPopup('🏆 你赢得了胜利！', 5000);
            else showEventPopup('🏆 ' + alive[0].name + ' 获胜！', 5000);
        }
        this.updateStatusBar();
        renderGame();
    }

    async resolveWarAsync(i, j) {
        var state = this.prepareWarState(i, j);
        if (!state) return;
        if (!tutorial.active && !this.simulationMode && (i === 0 || j === 0)) {
            showEventPopup('⚔️ 你与 ' + (i === 0 ? this.players[j].name : this.players[i].name) + ' 发生战争！', 3000);
        }
        var combatDelay = parseFloat(document.getElementById('combatDelaySlider').value) * 1000;
        this.resolveMeleePhase(state);
        renderGame();
        await new Promise(function(r) { setTimeout(r, combatDelay); });
        await waitForSimulationResume();
        if (this.players[state.firstAttacker].alive && this.players[state.secondAttacker].alive) {
            this.ensureCapital(state.firstAttacker);
            this.ensureCapital(state.secondAttacker);
            await this.remoteAttackAsync(state.firstAttacker, state.secondAttacker, false);
        }
        if (this.players[state.firstAttacker].alive && this.players[state.secondAttacker].alive) {
            this.ensureCapital(state.firstAttacker);
            this.ensureCapital(state.secondAttacker);
            await this.remoteAttackAsync(state.secondAttacker, state.firstAttacker, false);
        }
        this.updateStatusBar();
    }

    async resolveMergedWars(pairs, skipDelay) {
        if (skipDelay === undefined) skipDelay = false;
        var combatDelay = parseFloat(document.getElementById('combatDelaySlider').value) * 1000;
        for (var k = 0; k < pairs.length; k++) {
            if (this.finished) return;
            if (!skipDelay && k > 0) {
                await new Promise(function(r) { setTimeout(r, combatDelay); });
            }
            await waitForSimulationResume();
            var state = this.prepareWarState(pairs[k][0], pairs[k][1]);
            if (!state) continue;
            this.resolveMeleePhase(state);
            if (this.players[state.firstAttacker].alive && this.players[state.secondAttacker].alive) {
                this.ensureCapital(state.firstAttacker);
                this.ensureCapital(state.secondAttacker);
                await this.remoteAttackAsync(state.firstAttacker, state.secondAttacker, true);
            }
            if (this.players[state.firstAttacker].alive && this.players[state.secondAttacker].alive) {
                this.ensureCapital(state.firstAttacker);
                this.ensureCapital(state.secondAttacker);
                await this.remoteAttackAsync(state.secondAttacker, state.firstAttacker, true);
            }
            renderGame();
        }
    }

    async remoteAttackAsync(attacker, defender, merged) {
        if (merged === undefined) merged = false;
        var pAtt = this.players[attacker], pDef = this.players[defender];
        if (!pAtt.alive || !pDef.alive) return null;
        var D = pAtt.atkRange;
        if (D === 0) return null;
        var attackCapital = pAtt.capital;
        if (!attackCapital) return null;
        var groups = {};
        for (var ti = 0; ti < pDef.territories.length; ti++) {
            var t = pDef.territories[ti];
            var d = manhattan(t, attackCapital);
            if (d <= D) { if (!groups[d]) groups[d] = []; groups[d].push(t); }
        }
        var alliesAttack = [];
        for (var k = 0; k < this.players.length; k++) {
            if (k !== attacker && this.players[attacker].relations[k] === 1 && this.players[k].alive) {
                if (Math.random() < 0.5) alliesAttack.push(k);
            }
        }
        var combatDelay = parseFloat(document.getElementById('combatDelaySlider').value) * 1000;
        var keys = Object.keys(groups).map(Number).sort(function(a, b) { return a - b; });
        var totalCaptured = 0, totalBlocked = 0, totalMissed = 0;
        var isHumanWar = !tutorial.active && !this.simulationMode && (attacker === 0 || defender === 0);

        for (var idx = 0; idx < keys.length; idx++) {
            var d = keys[idx];
            var count = groups[d].length;
            var atkSuccess, defSuccess;
            if (tutorial.active && tutorialForce.orangeRemoteLose && attacker === 0 && defender === 3) {
                atkSuccess = true; defSuccess = false;
            } else {
                atkSuccess = Math.random() < remoteHitProb(d, D);
                if (!atkSuccess) for (var ai = 0; ai < alliesAttack.length; ai++) if (Math.random() < 0.5) { atkSuccess = true; break; }
                if (atkSuccess) {
                    defSuccess = Math.random() < remoteHitProb(d, pDef.defRange);
                    if (!defSuccess) {
                        for (var k = 0; k < this.players.length; k++) {
                            if (k !== defender && this.players[defender].relations[k] === 1 && this.players[k].alive) {
                                if (Math.random() < 0.5) { defSuccess = true; break; }
                            }
                        }
                    }
                }
            }
            if (atkSuccess && !defSuccess) {
                var capturedSet = new Set();
                for (var pi = 0; pi < groups[d].length; pi++) {
                    var pos = groups[d][pi];
                    if (this.grid[pos.y][pos.x].owner === defender) {
                        this.grid[pos.y][pos.x].owner = attacker;
                        this.grid[pos.y][pos.x].troops = 0;
                        this.grid[pos.y][pos.x].capitalOf = -1;
                        pAtt.territories.push({ x: pos.x, y: pos.y });
                        capturedSet.add(pos.x + ',' + pos.y);
                    }
                }
                if (capturedSet.size > 0) {
                    pDef.territories = pDef.territories.filter(function(t) {
                        return !capturedSet.has(t.x + ',' + t.y);
                    });
                }
                totalCaptured += count;
                if (!merged) {
                    this.addLog('🎯 远程[距离' + d + ']：' + cname(pAtt) + ' 命中 ' + cname(pDef) + ' 的 ' + count + ' 格，全部夺取');
                    if (isHumanWar) showEventPopup('🎯 [距离' + d + '] ' + pAtt.name + ' 远程命中，夺取 ' + count + ' 格！', 2500);
                }
                this.ensureCapital(defender);
                this.ensureCapital(attacker);
            } else if (atkSuccess) {
                totalBlocked += count;
                if (!merged) {
                    this.addLog('🛡️ 远程[距离' + d + ']：' + cname(pAtt) + ' 命中，但被 ' + cname(pDef) + ' 防御挡住');
                    if (isHumanWar) showEventPopup('🛡️ [距离' + d + '] ' + pDef.name + ' 挡住了远程攻击', 2200);
                }
            } else {
                totalMissed += count;
                if (!merged) {
                    this.addLog('💨 远程[距离' + d + ']：' + cname(pAtt) + ' 未命中 ' + cname(pDef) + ' 的 ' + count + ' 格');
                    if (isHumanWar) showEventPopup('💨 [距离' + d + '] ' + pAtt.name + ' 远程攻击未命中', 2000);
                }
            }
            if (!merged) renderGame();
            if (!merged && idx < keys.length - 1) {
                await new Promise(function(r) { setTimeout(r, combatDelay); });
            }
        }

        if (merged) {
            var parts = [];
            if (totalCaptured > 0) parts.push('夺取 ' + totalCaptured + ' 格');
            if (totalBlocked > 0) parts.push('被挡 ' + totalBlocked + ' 格');
            if (totalMissed > 0) parts.push('未命中 ' + totalMissed + ' 格');
            var summary;
            if (totalCaptured > 0 && totalBlocked === 0 && totalMissed === 0) {
                summary = '🎯 远程：' + cname(pAtt) + ' 夺取 ' + cname(pDef) + ' 的 ' + totalCaptured + ' 格';
            } else if (totalCaptured > 0) {
                summary = '🎯 远程：' + cname(pAtt) + ' 对 ' + cname(pDef) + '：' + parts.join('，');
            } else {
                summary = '💨 远程：' + cname(pAtt) + ' 对 ' + cname(pDef) + ' 未能夺取领土（' + parts.join('，') + '）';
            }
            this.addLog(summary);
            if (isHumanWar && totalCaptured > 0) showEventPopup('🎯 ' + pAtt.name + ' 远程夺取 ' + pDef.name + ' 的 ' + totalCaptured + ' 格！', 2200);
            renderGame();
        }

        if (totalCaptured > 0) return cname(pAtt) + ' 远程夺取 ' + totalCaptured + ' 格';
        return null;
    }

    updateCooldowns() {
        for (var pi = 0; pi < this.players.length; pi++) {
            var p = this.players[pi];
            for (var i=0; i<p.cooldown.length; i++) if (p.cooldown[i] > 0) p.cooldown[i]--;
            if (p.capitalCooldown > 0) p.capitalCooldown--;
        }
    }

    getValidActions(pid) {
        var p = this.players[pid];
        if (!p.alive || this.finished) return [];
        var actions = [];
        var dirs = ['up','down','left','right'];
        for (var di = 0; di < dirs.length; di++) {
            var d = dirs[di];
            var dx=0, dy=0;
            if (d==='up') dy=-1; else if (d==='down') dy=1; else if (d==='left') dx=-1; else dx=1;
            var possible = false;
            for (var ti = 0; ti < p.territories.length; ti++) {
                var t = p.territories[ti];
                var nx=t.x+dx, ny=t.y+dy;
                if (nx>=0 && nx<this.W && ny>=0 && ny<this.H && this.isEmpty(nx,ny)) { possible=true; break; }
            }
            if (possible) actions.push({type:'expand', dir:d, label:'扩张-' + d});
        }
        actions.push({type:'recruit', label:'征兵'});
        actions.push({type:'research_attack', label:'科研-攻击'});
        actions.push({type:'research_defense', label:'科研-防御'});
        for (var j=0; j<this.players.length; j++) {
            if (j===pid || !this.players[j].alive) continue;
            var rel = p.relations[j];
            if (p.cooldown[j] > 0) continue;
            if (rel === 0) {
                actions.push({type:'ally', target:j, label:'结盟-' + this.players[j].name});
                actions.push({type:'war', target:j, label:'宣战-' + this.players[j].name});
            } else if (rel === 1) {
                actions.push({type:'unally', target:j, label:'解盟-' + this.players[j].name});
            } else if (rel === -1) {
                actions.push({type:'peace', target:j, label:'求和-' + this.players[j].name});
            }
        }
        return actions;
    }

    performAction(pid, action, extra) {
        var p = this.players[pid];
        if (!p.alive || this.finished) return false;
        var success = false, result = null;
        switch (action.type) {
            case 'expand': success = this.expand(pid, action.dir); break;
            case 'recruit': { var g = this.recruit(pid); success = (g !== false); result = g; break; }
            case 'research_attack': { var inc = this.research(pid, 'attack'); success = (inc !== false); result = inc; break; }
            case 'research_defense': { var inc = this.research(pid, 'defense'); success = (inc !== false); result = inc; break; }
            case 'ally': success = this.changeRelation(pid, action.target, 1); break;
            case 'war': success = this.changeRelation(pid, action.target, -1); break;
            case 'unally': success = this.changeRelation(pid, action.target, 0); break;
            case 'peace': success = this.changeRelation(pid, action.target, 0); break;
            default: return false;
        }
        if (success) this.updateCooldowns();
        return { success: success, result: result };
    }

    getAllyTroops(pid) {
        var sum = 0;
        for (var k=0; k<this.players.length; k++) {
            if (k!==pid && this.players[pid].relations[k]===1 && this.players[k].alive) sum += this.players[k].troops*0.5;
        }
        return sum;
    }

    aiTurn(pid) {
        var p = this.players[pid];
        if (!p.alive || this.finished) return;
        if (!tutorial.active && !this.simulationMode && this.currentActingPlayer !== pid) return;
        if (tutorial.active) {
            var step = TUTORIAL_STEPS[tutorial.step];
            if (step && step.allowed) return;
            if (pid !== 2 && pid !== 0) return;
        }
        if (this.shouldRelocateCapital(pid)) this.relocateCapital(pid);
        var actions = this.getValidActions(pid);
        if (tutorial.active && pid !== 0) {
            actions = actions.filter(function(a) { return !['ally', 'war', 'unally', 'peace'].includes(a.type); });
        }
        if (actions.length === 0) return;

        var self = this;
        var alivePlayers = this.players.filter(function(q) { return q.alive; });
        var maxTroops = Math.max.apply(null, alivePlayers.map(function(q) { return q.troops; }));
        var maxAtk = Math.max.apply(null, alivePlayers.map(function(q) { return q.atkRange; }));
        var maxDef = Math.max.apply(null, alivePlayers.map(function(q) { return q.defRange; }));
        var avgTerritories = alivePlayers.reduce(function(s, q) { return s + q.territories.length; }, 0) / alivePlayers.length;
        var targetFactor = 1 - 0.4 * Math.max(0.01, this.R);
        var recruitTarget = Math.max(1, maxTroops * targetFactor);
        var atkTarget = Math.max(1, maxDef * targetFactor);
        var defTarget = Math.max(1, maxAtk * targetFactor);
        var territoryRatio = avgTerritories > 0 ? p.territories.length / avgTerritories : 1;
        var territoryCrisis = clamp(1 - territoryRatio / 0.5, 0, 1);

        var distToNearestEnemyTerritory = function(x, y) {
            var minD = Infinity;
            for (var qi = 0; qi < self.players.length; qi++) {
                var q = self.players[qi];
                if (q.id === pid || !q.alive || p.relations[q.id] !== -1) continue;
                for (var ti = 0; ti < q.territories.length; ti++) {
                    var d = manhattan({ x: x, y: y }, q.territories[ti]);
                    if (d < minD) minD = d;
                }
            }
            return minD === Infinity ? 999 : minD;
        };
        var distToNearestEnemyCapital = function(x, y) {
            var minD = Infinity;
            for (var qi = 0; qi < self.players.length; qi++) {
                var q = self.players[qi];
                if (q.id === pid || !q.alive || p.relations[q.id] !== -1) continue;
                if (!q.capital) continue;
                var d = manhattan({ x: x, y: y }, q.capital);
                if (d < minD) minD = d;
            }
            return minD === Infinity ? 999 : minD;
        };

        var scored = actions.map(function(a) {
            var raw = 0;
            switch (a.type) {
                case 'expand': {
                    var dx = 0, dy = 0;
                    if (a.dir === 'up') dy = -1; else if (a.dir === 'down') dy = 1;
                    else if (a.dir === 'left') dx = -1; else dx = 1;
                    var newCells = 0, totalPot = 0;
                    for (var ti = 0; ti < p.territories.length; ti++) {
                        var t = p.territories[ti];
                        var nx = t.x + dx, ny = t.y + dy;
                        if (nx >= 0 && nx < self.W && ny >= 0 && ny < self.H && self.isEmpty(nx, ny)) {
                            newCells++;
                            var pot = 4;
                            var dirs4 = [[0,1],[0,-1],[1,0],[-1,0]];
                            for (var d2i = 0; d2i < 4; d2i++) {
                                var d2 = dirs4[d2i];
                                var cx = nx + d2[0], cy = ny + d2[1];
                                if (cx >= 0 && cx < self.W && cy >= 0 && cy < self.H && self.isEmpty(cx, cy)) pot += 2;
                            }
                            for (var d2i = 0; d2i < 4; d2i++) {
                                var d2 = dirs4[d2i];
                                var cx = nx + d2[0], cy = ny + d2[1];
                                if (cx >= 0 && cx < self.W && cy >= 0 && cy < self.H && self.grid[cy][cx].owner === pid) pot += 5;
                            }
                            pot += Math.max(0, 8 - distToNearestEnemyTerritory(nx, ny)) * (-1.0);
                            pot += Math.max(0, 12 - distToNearestEnemyCapital(nx, ny)) * (-0.3);
                            if (manhattan({ x: nx, y: ny }, p.capital) <= 1) pot += 8;
                            var distToEdge = Math.min(nx, ny, self.W - 1 - nx, self.H - 1 - ny);
                            if (distToEdge <= 2) pot += 5;
                            if ((nx === 0 || nx === self.W - 1) && (ny === 0 || ny === self.H - 1)) pot += 3;
                            totalPot += pot;
                        }
                    }
                    raw = newCells * (newCells > 0 ? totalPot / newCells : 0);
                    for (var ti = 0; ti < p.territories.length; ti++) {
                        var t = p.territories[ti];
                        var nx = t.x + dx, ny = t.y + dy;
                        if (nx >= 0 && nx < self.W && ny >= 0 && ny < self.H) {
                            var c = self.grid[ny][nx];
                            if (c.owner !== -1 && c.owner !== pid) { raw += 20; break; }
                        }
                    }
                    raw = raw * (1 + p.Exp * 0.5 + territoryCrisis * 0.6);
                    break;
                }
                case 'recruit': {
                    var need = Math.max(0, (recruitTarget - p.troops) / Math.max(1, recruitTarget)) * 100;
                    raw = need * (1 + (1 - p.Cau) * 0.5 + territoryCrisis * 0.8);
                    if (p.troops < recruitTarget * 0.5) raw += 40;
                    else if (p.troops < recruitTarget * 0.7) raw += 20;
                    break;
                }
                case 'research_attack': {
                    var need = Math.max(0, (atkTarget - p.atkRange) / Math.max(1, atkTarget)) * 100;
                    var raw0 = need * (1 + p.Tech * 0.8);
                    if (p.atkRange === 0) raw0 += 10;
                    if (p.atkRange < atkTarget * 0.5) raw0 += 40;
                    else if (p.atkRange < atkTarget * 0.7) raw0 += 20;
                    raw = raw0 * (1 - territoryCrisis * 0.5);
                    break;
                }
                case 'research_defense': {
                    var need = Math.max(0, (defTarget - p.defRange) / Math.max(1, defTarget)) * 100;
                    var raw0 = need * (1 + p.Tech * 0.8);
                    if (p.defRange === 0) raw0 += 10;
                    if (p.defRange < defTarget * 0.5) raw0 += 40;
                    else if (p.defRange < defTarget * 0.7) raw0 += 20;
                    raw = raw0 * (1 + territoryCrisis * 0.4);
                    break;
                }
                case 'ally': {
                    var target = self.players[a.target];
                    if (!target.alive) { raw = -1000; break; }
                    var tStr = target.troops + target.atkRange * 5 + target.defRange * 3;
                    var safe = 1 / (1 + manhattan(p.capital, target.capital));
                    var hasEnemyBorder = false;
                    for (var k = 0; k < self.players.length; k++) {
                        if (k !== pid && k !== a.target && p.relations[k] === -1 && self.hasBorder(a.target, k)) { hasEnemyBorder = true; break; }
                    }
                    var score = tStr * safe + p.Soc * 20;
                    if (hasEnemyBorder) score -= 20;
                    var accept = self.getAcceptProb(pid, a.target, 'alliance');
                    if (accept < 0.3) score -= 15;
                    raw = score * (1 + p.Soc * 0.5 + territoryCrisis * 0.5);
                    break;
                }
                case 'war': {
                    var target = self.players[a.target];
                    if (!target.alive) { raw = -1000; break; }
                    var myTotal = p.troops + self.getAllyTroops(pid);
                    var enTotal = target.troops + self.getAllyTroops(a.target);
                    var ratio = myTotal / (enTotal || 1);
                    var score = 0;
                    if (self.hasBorder(pid, a.target)) score += (ratio - 1) * 30;
                    if (p.atkRange > 0 && manhattan(p.capital, target.capital) <= p.atkRange) score += p.atkRange * 5;
                    if (ratio < 0.8) score -= 25;
                    if (ratio > 1.2) score += 10;
                    raw = (score + p.Agg * 30) * (1 + p.Agg * 0.5 - territoryCrisis * 0.7);
                    break;
                }
                case 'unally': {
                    var target = self.players[a.target];
                    if (!target.alive) { raw = -1000; break; }
                    var contrib = target.troops * 0.5;
                    var attackPotential = 0;
                    if (self.hasBorder(pid, a.target)) {
                        var myTotal = p.troops + self.getAllyTroops(pid) - target.troops * 0.5;
                        var enTotal = target.troops + self.getAllyTroops(a.target) - p.troops * 0.5;
                        var ratio = myTotal / (enTotal || 1);
                        if (ratio > 1.2) attackPotential = 30;
                    }
                    var benefit = contrib - attackPotential;
                    if (benefit < 0) { raw = -1000; break; }
                    raw = (benefit + p.Agg * 20) * (1 + p.Agg * 0.5 - territoryCrisis * 0.5);
                    break;
                }
                case 'peace': {
                    var target = self.players[a.target];
                    if (!target.alive) { raw = -1000; break; }
                    var myTotal = p.troops + self.getAllyTroops(pid);
                    var enTotal = target.troops + self.getAllyTroops(a.target);
                    var need = Math.max(0, (enTotal - myTotal) / (enTotal + 1)) * 100;
                    var accept = self.getAcceptProb(pid, a.target, 'peace');
                    var score = need + (1 - p.Agg) * 30;
                    if (accept < 0.2) score -= 20;
                    raw = score * (1 + p.Soc * 0.5 + territoryCrisis * 0.6);
                    break;
                }
                default: raw = -1000;
            }

            var percentile = 0.5;
            if (raw > -1000) percentile = estimatePercentile(raw, a.type);
            var effectiveR = Math.max(0.01, self.R);
            var factor = 1 + (Math.random() * 2 - 1) * effectiveR;
            var finalScore = Math.max(0, Math.min(1, percentile * factor));
            return { action: a, rawScore: raw, percentile: percentile, finalScore: finalScore };
        });

        scored.sort(function(a, b) { return b.finalScore - a.finalScore; });
        if (scored.length === 0) return;

        if (DEBUG_AI_SCORES) {
            var shortNames = {
                'expand': '扩张', 'recruit': '征兵', 'research_attack': '攻科研',
                'research_defense': '防科研', 'ally': '结盟', 'war': '宣战',
                'unally': '解盟', 'peace': '求和'
            };
            var lines = ['🤖 ' + p.name + '(兵' + p.troops + '/土' + p.territories.length + '):'];
            for (var si = 0; si < scored.length; si++) {
                var s = scored[si];
                var dirSuffix = s.action.dir ? '-' + s.action.dir : '';
                var tgt = (s.action.target !== undefined) ? '→' + self.players[s.action.target].name : '';
                lines.push('   ' + shortNames[s.action.type] + dirSuffix + tgt + ': raw=' + Math.round(s.rawScore) + ' p=' + (s.percentile*100).toFixed(1) + '% f=' + (s.finalScore*100).toFixed(1) + '%');
            }
            this.addLog(lines.join('\n'));
        }

        this.performAction(pid, scored[0].action);
    }

    async startNewTurnAsync() {
        if (this.finished) return;
        if (!this.players[0].alive && !this.simulationMode) return;
        this.waitingForHuman = false;
        var self = this;
        this.turnOrder = this.fixedTurnOrder.filter(function(id) { return self.players[id].alive; });
        this.humanOrderIdx = this.turnOrder.indexOf(0);
        var actionDelay = parseFloat(document.getElementById('actionDelaySlider').value) * 1000;
        for (var i = 0; i < this.humanOrderIdx; i++) {
            var pid = this.turnOrder[i];
            if (pid === 0) continue;
            await waitForDiplo();
            await waitForSimulationResume();
            if (this.players[pid].alive && !this.finished) {
                this.currentActingPlayer = pid;
                this.updateStatusBar();
                this.aiTurn(pid);
                renderGame();
                await waitForDiplo();
                await new Promise(function(r) { setTimeout(r, actionDelay); });
            }
        }
        if (this.finished) return;
        this.currentActingPlayer = 0;
        this.waitingForHuman = true;
        renderGame();
        setFeedback('轮到你了', 'info');
    }

    async finishHumanTurnAsync() {
        if (this.finished) return;
        this.waitingForHuman = false;
        renderGame();
        var actionDelay = parseFloat(document.getElementById('actionDelaySlider').value) * 1000;
        await waitForDiplo();
        await new Promise(function(r) { setTimeout(r, actionDelay); });
        for (var i = (this.humanOrderIdx ?? -1) + 1; i < (this.turnOrder?.length ?? 0); i++) {
            var pid = this.turnOrder[i];
            if (pid === 0) continue;
            await waitForDiplo();
            await waitForSimulationResume();
            if (this.players[pid].alive && !this.finished) {
                this.currentActingPlayer = pid;
                this.updateStatusBar();
                this.aiTurn(pid);
                renderGame();
                await waitForDiplo();
                await new Promise(function(r) { setTimeout(r, actionDelay); });
            }
        }
        if (!this.finished) {
            await waitForDiplo();
            await this.resolveWarsAsync();
        }
        this.updateCooldowns();
        this.ensureCapital(0);
        var human = this.players[0];
        if (human.alive && human.territories.length === 0) {
            human.alive = false;
            this.addLog('你失去了全部领土，被淘汰');
            showEventPopup('💀 你失去了全部领土，被淘汰！', 5000);
        }
        this.turn++;
        this.updateStatusBar();
        document.getElementById('turnDisplay').textContent = this.turn;
        if (this.finished) {
            this.currentActingPlayer = -1;
            this.addLog('游戏结束！');
            renderGame();
            return;
        }
        if (!human.alive) {
            setFeedback('你已被淘汰，AI 自动对战开始...', 'info');
            document.getElementById('mainMenu').innerHTML = '<span style="color:#f44336;">你已被淘汰，正在自动进行...</span>';
            document.getElementById('subMenu').innerHTML = '';
            this.autoPlay().then(function() { renderGame(); });
            return;
        }
        await this.startNewTurnAsync();
        renderGame();
    }

    async autoPlay() {
        this.waitingForHuman = false;
        var self = this;
        while (!this.finished) {
            var order = this.fixedTurnOrder.filter(function(id) { return self.players[id].alive; });
            var actionDelay = parseFloat(document.getElementById('actionDelaySlider').value) * 1000;
            for (var oi = 0; oi < order.length; oi++) {
                var pid = order[oi];
                if (!this.simulationMode && this.players[pid].human) continue;
                await waitForDiplo();
                await waitForSimulationResume();
                if (this.players[pid].alive && !this.finished) {
                    this.currentActingPlayer = pid;
                    this.updateStatusBar();
                    this.aiTurn(pid);
                    renderGame();
                    await waitForDiplo();
                    await new Promise(function(r) { setTimeout(r, actionDelay); });
                }
            }
            if (!this.finished) {
                await waitForDiplo();
                await this.resolveWarsAsync();
            }
            this.updateCooldowns();
            this.turn++;
            this.updateStatusBar();
            document.getElementById('turnDisplay').textContent = this.turn;
            renderGame();
            var alive = this.players.filter(function(p) { return p.alive; });
            if (alive.length <= 1) {
                this.finished = true;
                this.currentActingPlayer = -1;
                if (alive.length === 1) this.addLog('🏆 ' + cname(alive[0]) + ' 获胜！');
                break;
            }
            await new Promise(function(r) { setTimeout(r, 300); });
        }
        renderGame();
    }
}
