var G = null;
var selectedInfoPlayer = -1;

function setFeedback(msg, type) {
    if (type === undefined) type = 'info';
    var area = document.getElementById('feedbackArea');
    area.textContent = msg;
    area.className = 'feedback ' + type;
    area.style.opacity = 1;
    clearTimeout(window.feedbackTimeout);
    window.feedbackTimeout = setTimeout(function() { area.style.opacity = 0.6; }, 3000);
}

function renderGame() {
    if (!G) return;
    var container = document.getElementById('mapContainer');
    var containerWidth = container.clientWidth - 8;
    var containerHeight = container.clientHeight || 600;
    var effectiveHeight = containerHeight > 100 ? containerHeight : 600;

    var fitCellSize = Math.min(containerWidth / G.W, effectiveHeight / G.H);
    var cellSize = fitCellSize * zoomLevel;
    cellSize = Math.max(8, Math.min(cellSize, 120));
    var labelFontSize = cellSize * LABEL_RATIO;
    var labelStyle = 'font-size:' + labelFontSize + 'px;';

    var zoomDisplay = document.getElementById('zoomDisplay');
    if (zoomDisplay) zoomDisplay.textContent = Math.round(zoomLevel * 100) + '%';

    var html = '<table>';

    var viewPid = selectedInfoPlayer;
    if (viewPid === -1) viewPid = 0;
    if (!G.players[viewPid] || !G.players[viewPid].alive) viewPid = 0;
    var viewer = G.players[viewPid];
    var viewerAtk = viewer && viewer.alive ? viewer.atkRange : 0;
    var viewerCap = viewer ? viewer.capital : null;

    for (var y=0; y<G.H; y++) {
        html += '<tr>';
        for (var x=0; x<G.W; x++) {
            var cell = G.grid[y][x];
            var owner = cell.owner;
            var isCapital = (cell.capitalOf !== -1);
            var bg = '#2a3142';
            var text = '';
            var borderColor = '';
            var borderWidth = '1px';
            var distText = '';
            var probText = '';

            if (viewerCap) distText = manhattan({x:x, y:y}, viewerCap);

            if (owner !== -1) {
                bg = G.players[owner].color;
                if (isCapital) text = '★';
                if (isCapital) {
                    var effectiveSelected = (selectedInfoPlayer === -1) ? 0 : selectedInfoPlayer;
                    if (effectiveSelected >= 0 && effectiveSelected < G.players.length) {
                        if (owner === effectiveSelected) borderColor = '#ffffff';
                        else {
                            var relVal = G.players[effectiveSelected].relations[owner];
                            if (relVal === 1) borderColor = '#4a9eff';
                            else if (relVal === -1) borderColor = '#ff4a4a';
                            else borderColor = '#ffdd4a';
                        }
                        borderWidth = '2px';
                    }
                }
            }

            if (owner !== -1 && owner !== viewPid && viewer && viewer.alive && viewerCap && viewerAtk > 0) {
                var d = manhattan({x:x, y:y}, viewerCap);
                var atkProb = remoteHitProb(d, viewerAtk);
                var defender = G.players[owner];
                var defProb = remoteHitProb(d, defender.defRange);
                var finalProb = atkProb * (1 - defProb);
                if (finalProb > 0.001) probText = Math.round(finalProb * 100) + '%';
            }

            var cls = (owner!==-1 ? 'owned' : '') + (isCapital ? ' capital' : '');
            var dataAttr = isCapital ? ' data-player="' + cell.capitalOf + '"' : '';
            var style = 'background:' + bg + '; width:' + cellSize + 'px; height:' + cellSize + 'px; min-width:' + cellSize + 'px; min-height:' + cellSize + 'px;';
            if (borderColor) style += ' border-color: ' + borderColor + ' !important; border-width: ' + borderWidth + ' !important;';
            else style += ' border-color: #3d465a; border-width: 1px;';

            html += '<td class="' + cls + '" style="' + style + '" ' + dataAttr + '>' +
                text +
                (distText !== '' ? '<span class="dist-label" style="' + labelStyle + '">' + distText + '</span>' : '') +
                (probText ? '<span class="prob-label" style="' + labelStyle + '">' + probText + '</span>' : '') +
                '</td>';
        }
        html += '</tr>';
    }
    html += '</table>';
    container.innerHTML = html;

    container.querySelectorAll('td.capital').forEach(function(td) {
        td.addEventListener('click', function(e) {
            e.stopPropagation();
            if (panMoved) { panMoved = false; return; }
            var pid = parseInt(this.dataset.player);
            if (!isNaN(pid) && pid >= 0 && pid < G.players.length) {
                if (selectedInfoPlayer === pid) selectedInfoPlayer = -1;
                else selectedInfoPlayer = pid;
                renderGame();
            }
        });
    });

    G.updateStatusBar();
    document.getElementById('turnDisplay').textContent = G.turn;
    buildMainMenu();
    checkTutorialConditional();
}

function hideInfoPanel() {
    if (selectedInfoPlayer === -1) return;
    selectedInfoPlayer = -1;
    renderGame();
}

function buildMainMenu() {
    var mainDiv = document.getElementById('mainMenu');
    var subDiv = document.getElementById('subMenu');
    if (!G || G.finished) {
        mainDiv.innerHTML = '<span style="color:#7f8bb3;">游戏已结束</span>';
        subDiv.innerHTML = '';
        return;
    }
    if (G.simulationMode) {
        var pauseHint = simulationPaused ? '（已暂停，点击 ⏸ / ▶ 按钮继续）' : '';
        mainDiv.innerHTML = '<span style="color:#a890ff; font-weight:bold;">🤖 AI 模拟进行中...' + pauseHint + '</span>' +
            '<div style="width:100%; margin-top:6px; font-size:0.8rem; color:#7f8bb3;">点击地图上的★可切换观察视角</div>';
        subDiv.innerHTML = '';
        return;
    }
    if (G.pendingConfirm) {
        var orderNames = G.fixedTurnOrder.map(function(pid) {
            var p = G.players[pid];
            return '<span style="color:' + p.color + '; font-weight:bold;">' + p.name + '</span>';
        }).join(' → ');
        var humanPos = G.fixedTurnOrder.indexOf(0) + 1;
        var total = G.fixedTurnOrder.length;
        mainDiv.innerHTML =
            '<div style="width:100%; margin-bottom:8px; line-height:1.9; font-size:0.85rem;">' +
                '<div style="color:#aab3d0;">行动顺序：</div>' +
                '<div>' + orderNames + '</div>' +
                '<div style="margin-top:4px;">你是第 <span style="color:#ffdd4a; font-weight:bold; font-size:1.05rem;">' + humanPos + '</span> 个行动（共 ' + total + ' 位）</div>' +
            '</div>' +
            '<button class="main-btn" id="confirmStartBtn" style="background:#2d6a4f; min-width:110px;">▶ 开始游戏</button>';
        document.getElementById('confirmStartBtn').onclick = function() {
            G.pendingConfirm = false;
            setFeedback('游戏开始！', 'info');
            renderGame();
            var actionDelay = parseFloat(document.getElementById('actionDelaySlider').value) * 1000;
            var firstPid = G.fixedTurnOrder[0];
            if (firstPid !== 0) {
                G.currentActingPlayer = firstPid;
                G.updateStatusBar();
                setTimeout(function() { G.startNewTurnAsync().then(function() { renderGame(); }); }, actionDelay);
            } else {
                G.startNewTurnAsync().then(function() { renderGame(); });
            }
        };
        subDiv.innerHTML = '';
        return;
    }
    var human = G.players[0];
    if (!human.alive) {
        mainDiv.innerHTML = '<span style="color:#f44336;">你已被淘汰，正在自动进行...</span>';
        subDiv.innerHTML = '';
        return;
    }
    if (!G.waitingForHuman) {
        mainDiv.innerHTML = '<span style="color:#7f8bb3;">等待其他玩家行动...</span>';
        subDiv.innerHTML = '';
        return;
    }
    var mainBtns = [
        { id: 'expand', label: '扩张' },
        { id: 'recruit', label: '征兵' },
        { id: 'research', label: '科研' },
        { id: 'diplomacy', label: '外交' },
        { id: 'relocate', label: '迁都' }
    ];
    var html = '';
    for (var i = 0; i < mainBtns.length; i++) html += '<button class="main-btn" data-action="' + mainBtns[i].id + '">' + mainBtns[i].label + '</button>';
    mainDiv.innerHTML = html;
    mainDiv.querySelectorAll('.main-btn').forEach(function(btn) {
        btn.addEventListener('click', function() { handleMainAction(this.dataset.action); });
    });
    subDiv.innerHTML = '';
}

function handleMainAction(action) {
    var subDiv = document.getElementById('subMenu');
    var human = G.players[0];
    if (!human.alive || G.finished) return;
    if (G.simulationMode) return;

    if (tutorial.active) {
        var step = TUTORIAL_STEPS[tutorial.step];
        if (step && step.allowed && step.allowed.main !== action) {
            setFeedback('请按教程提示操作', 'info');
            return;
        }
    }

    var subHtml = '';
    switch (action) {
        case 'expand': {
            var dirs = ['上','下','左','右'];
            for (var i = 0; i < dirs.length; i++) {
                var d = dirs[i];
                var dirMap = {'上':'up','下':'down','左':'left','右':'right'};
                subHtml += '<button class="sub-btn" data-dir="' + dirMap[d] + '">' + d + '</button>';
            }
            subDiv.innerHTML = subHtml;
            subDiv.querySelectorAll('.sub-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var dir = this.dataset.dir;
                    if (tutorial.active) {
                        var step = TUTORIAL_STEPS[tutorial.step];
                        if (step && step.allowed && step.allowed.dir && dir !== step.allowed.dir) {
                            setFeedback('请按教程提示的方向扩张', 'info');
                            return;
                        }
                    }
                    var result = G.performAction(0, {type:'expand', dir:dir});
                    if (result.success) { setFeedback('扩张成功', 'success'); afterHumanAction('expand', { dir: dir }); }
                    else setFeedback('扩张失败（可能无相邻空格）', 'fail');
                });
            });
            break;
        }
        case 'recruit': {
            var result = G.performAction(0, {type:'recruit'});
            if (result.success) { setFeedback('征兵成功，获得 ' + result.result + ' 兵力', 'success'); afterHumanAction('recruit'); }
            else setFeedback('征兵失败', 'fail');
            break;
        }
        case 'research': {
            subHtml = '<button class="sub-btn" data-type="attack">攻击</button>' +
                       '<button class="sub-btn" data-type="defense">防御</button>';
            subDiv.innerHTML = subHtml;
            subDiv.querySelectorAll('.sub-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var type = this.dataset.type;
                    var actionKey = type === 'attack' ? 'research_attack' : 'research_defense';
                    if (tutorial.active) {
                        var step = TUTORIAL_STEPS[tutorial.step];
                        if (step && step.allowed && step.allowed.sub && step.allowed.sub !== actionKey) {
                            setFeedback('请按教程提示选择', 'info');
                            return;
                        }
                    }
                    var result = G.performAction(0, {type: actionKey});
                    if (result.success) {
                        var label = type === 'attack' ? '攻击' : '防御';
                        setFeedback('科研成功，' + label + '射程 +' + result.result, 'success');
                        afterHumanAction(actionKey);
                    } else setFeedback('科研失败', 'fail');
                });
            });
            break;
        }
        case 'diplomacy': {
            var list = '';
            for (var i=1; i<G.players.length; i++) {
                var p = G.players[i];
                if (!p.alive) continue;
                var rel = human.relations[i];
                var relName = {1:'同盟',0:'中立','-1':'敌对'}[rel];
                list += '<button class="sub-btn" data-target="' + i + '" style="border-left: 4px solid ' + p.color + ';">' + p.name + ' (' + relName + ')</button>';
            }
            if (!list) subHtml = '<span style="color:#7f8bb3;">无其他存活玩家</span>';
            else subHtml = list;
            subDiv.innerHTML = subHtml;
            subDiv.querySelectorAll('.sub-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var target = parseInt(this.dataset.target);
                    if (tutorial.active) {
                        var step = TUTORIAL_STEPS[tutorial.step];
                        if (step && step.allowed && step.allowed.target !== undefined && step.allowed.target !== target) {
                            setFeedback('请按教程提示选择目标', 'info');
                            return;
                        }
                    }
                    var rel = human.relations[target];
                    var options = '';
                    if (rel === 0) {
                        options = '<button class="sub-btn" data-diplo="ally" data-target="' + target + '">结盟</button>' +
                                  '<button class="sub-btn" data-diplo="war" data-target="' + target + '">宣战</button>';
                    } else if (rel === 1) {
                        options = '<button class="sub-btn" data-diplo="unally" data-target="' + target + '">解盟</button>';
                    } else if (rel === -1) {
                        options = '<button class="sub-btn" data-diplo="peace" data-target="' + target + '">求和</button>';
                    }
                    subDiv.innerHTML = options;
                    subDiv.querySelectorAll('.sub-btn').forEach(function(btn2) {
                        btn2.addEventListener('click', function() {
                            var diploType = this.dataset.diplo;
                            var tgt = parseInt(this.dataset.target);
                            if (tutorial.active) {
                                var step = TUTORIAL_STEPS[tutorial.step];
                                if (step && step.allowed && step.allowed.sub && step.allowed.sub !== diploType) {
                                    setFeedback('请按教程提示选择', 'info');
                                    return;
                                }
                            }
                            var result = G.performAction(0, {type: diploType, target: tgt});
                            if (result.success) setFeedback('外交成功', 'success');
                            else setFeedback('外交失败（可能冷却中或对方拒绝）', 'fail');
                            afterHumanAction(diploType, { target: tgt });
                        });
                    });
                });
            });
            break;
        }
        case 'relocate': {
            if (human.capitalCooldown > 0) {
                setFeedback('迁都冷却中（剩余 ' + human.capitalCooldown + ' 回合）', 'fail');
                break;
            }
            var ok = G.relocateCapital(0);
            if (ok) {
                setFeedback('迁都成功，首都已移至领土几何中心', 'success');
                renderGame();
                if (tutorial.active) afterHumanAction('relocate');
            } else {
                setFeedback('迁都失败（可能已在几何中心）', 'fail');
            }
            break;
        }
    }
}

function checkHumanEliminated() {
    if (!G || G.finished) return;
    var human = G.players[0];
    if (!human.alive) {
        setFeedback('你已被淘汰，AI 自动对战开始...', 'info');
        document.getElementById('mainMenu').innerHTML = '<span style="color:#f44336;">你已被淘汰，正在自动进行...</span>';
        document.getElementById('subMenu').innerHTML = '';
        G.autoPlay().then(function() { renderGame(); });
    }
}

// =====================================================================
// 鼠标滚轮缩放 / 双指缩放 / 拖动平移
// =====================================================================
var mapContainer = document.getElementById('mapContainer');

mapContainer.addEventListener('click', function(e) {
    if (panMoved) { panMoved = false; return; }
    if (!e.target.closest('td.capital')) hideInfoPanel();
});

function onWheelZoom(e) {
    if (!G || G.finished) return;
    e.preventDefault();
    var oldZoom = zoomLevel;
    var factor = e.deltaY < 0 ? 1.1 : 0.9;
    zoomLevel = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoomLevel * factor));
    if (zoomLevel !== oldZoom) renderGame();
}

var panMoved = false;
var isPanning = false;
var panStartX = 0, panStartY = 0;
var panScrollLeft = 0, panScrollTop = 0;

mapContainer.addEventListener('mousedown', function(e) {
    if (!G || G.finished) return;
    if (e.button !== 0) return;
    isPanning = true;
    panMoved = false;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panScrollLeft = mapContainer.scrollLeft;
    panScrollTop = mapContainer.scrollTop;
    mapContainer.classList.add('panning');
});

document.addEventListener('mousemove', function(e) {
    if (!isPanning) return;
    var dx = e.clientX - panStartX;
    var dy = e.clientY - panStartY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) panMoved = true;
    mapContainer.scrollLeft = panScrollLeft - dx;
    mapContainer.scrollTop = panScrollTop - dy;
});

document.addEventListener('mouseup', function() {
    if (!isPanning) return;
    isPanning = false;
    mapContainer.classList.remove('panning');
});

var touchStartDist = 0;
var touchStartZoom = 1.0;
var isTouchPanning = false;
var touchStartX = 0, touchStartY = 0;
var touchScrollLeft = 0, touchScrollTop = 0;

function getTouchDistance(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
}

mapContainer.addEventListener('touchstart', function(e) {
    if (!G || G.finished) return;
    if (e.touches.length === 1) {
        isTouchPanning = true; panMoved = false;
        touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
        touchScrollLeft = mapContainer.scrollLeft; touchScrollTop = mapContainer.scrollTop;
    } else if (e.touches.length === 2) {
        isTouchPanning = false;
        touchStartDist = getTouchDistance(e.touches);
        touchStartZoom = zoomLevel;
    }
}, { passive: true });

mapContainer.addEventListener('touchmove', function(e) {
    if (!G || G.finished) return;
    if (e.touches.length === 1 && isTouchPanning) {
        e.preventDefault();
        var dx = e.touches[0].clientX - touchStartX;
        var dy = e.touches[0].clientY - touchStartY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) panMoved = true;
        mapContainer.scrollLeft = touchScrollLeft - dx;
        mapContainer.scrollTop = touchScrollTop - dy;
    } else if (e.touches.length === 2 && touchStartDist > 0) {
        e.preventDefault();
        var dist = getTouchDistance(e.touches);
        var ratio = dist / touchStartDist;
        zoomLevel = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, touchStartZoom * ratio));
        renderGame();
    }
}, { passive: false });

mapContainer.addEventListener('touchend', function(e) {
    if (e.touches.length < 2) touchStartDist = 0;
    if (e.touches.length === 0) isTouchPanning = false;
}, { passive: true });

mapContainer.addEventListener('wheel', onWheelZoom, { passive: false });

// =====================================================================
// 开始 / 重置
// =====================================================================
function startGame() {
    var W = parseInt(document.getElementById('mapW').value);
    var H = parseInt(document.getElementById('mapH').value);
    var totalPlayers = parseInt(document.getElementById('playerCnt').value);
    var diffValue = parseFloat(document.getElementById('difficultySlider').value);
    var R = Math.max(0.01, diffValue);
    var playerNameInput = document.getElementById('playerName').value.trim();
    var playerColor = document.getElementById('playerColor').value;
    if (!/^[A-Za-z0-9_]+$/.test(playerNameInput)) { alert('玩家名字仅允许英文、数字、下划线'); return; }
    if (W<4 || W>50 || H<4 || H>50 || totalPlayers<2 || totalPlayers>10) {
        alert('参数范围：宽高4-50，玩家2-10');
        return;
    }
    var selectedAIs = aiList.filter(function(a) { return selectedAISet.has(a.name); });
    var neededAI = totalPlayers - 1;
    if (selectedAIs.length > neededAI) { alert('已选AI数量超过所需'); return; }
    if (selectedAIs.length < neededAI) {
        var remaining = aiList.filter(function(a) { return !selectedAISet.has(a.name); });
        if (remaining.length < (neededAI - selectedAIs.length)) { alert('可用AI不足'); return; }
        var shuffled = remaining.slice();
        for (var i=shuffled.length-1; i>0; i--) {
            var j = rand(0,i);
            var t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t;
        }
        for (var i=0; i<(neededAI - selectedAIs.length); i++) {
            selectedAIs.push(shuffled[i]);
            selectedAISet.add(shuffled[i].name);
        }
        renderAIList();
    }
    var playersConfig = [];
    playersConfig.push({ human: true, name: playerNameInput, color: playerColor, Agg:0.5, Soc:0.5, Cau:0.5, Tech:0.5, Exp:0.5 });
    for (var ai_i = 0; ai_i < selectedAIs.length; ai_i++) {
        var ai = selectedAIs[ai_i];
        var aiName = ai.name;
        if (aiName === playerNameInput) aiName += '_1';
        var suffix = '', counter = 1;
        while (playersConfig.some(function(p) { return p.name === aiName + suffix; })) suffix = '_' + (counter++);
        aiName += suffix;
        playersConfig.push({
            human: false, name: aiName, color: ai.color || '#888',
            Agg: ai.Agg, Soc: ai.Soc, Cau: ai.Cau, Tech: ai.Tech, Exp: ai.Exp
        });
    }
    zoomLevel = 1.0;
    diploPaused = false;
    simulationPaused = false;
    selectedInfoPlayer = -1;
    tutorial.active = false;
    tutorial.step = 0;
    document.getElementById('logBox').innerHTML = '游戏开始';
    if (window._resizeHandler) {
        window.removeEventListener('resize', window._resizeHandler);
        window._resizeHandler = null;
    }
    G = new Game(W, H, playersConfig, R);
    G.pendingConfirm = true;
    G.simulationMode = false;
    document.getElementById('pauseBtn').style.display = 'none';
    document.getElementById('game').classList.add('active');
    document.getElementById('setup').style.display = 'none';
    renderGame();
    setFeedback('请确认行动顺序', 'info');
    document.getElementById('actionDelayDisplay').textContent = document.getElementById('actionDelaySlider').value;
    document.getElementById('combatDelayDisplay').textContent = document.getElementById('combatDelaySlider').value;
    window._resizeHandler = function() { renderGame(); };
    window.addEventListener('resize', window._resizeHandler);
}

function startAISimulation() {
    var W = parseInt(document.getElementById('mapW').value);
    var H = parseInt(document.getElementById('mapH').value);
    var totalPlayers = parseInt(document.getElementById('playerCnt').value);
    var diffValue = parseFloat(document.getElementById('difficultySlider').value);
    var R = Math.max(0.01, diffValue);
    if (W<4 || W>50 || H<4 || H>50 || totalPlayers<2 || totalPlayers>10) {
        alert('参数范围：宽高4-50，玩家2-10');
        return;
    }
    if (aiList.length === 0) { alert('没有可用的 AI'); return; }
    var selectedAIs = aiList.filter(function(a) { return selectedAISet.has(a.name); });
    var neededAI = totalPlayers;
    if (selectedAIs.length > neededAI) selectedAIs = selectedAIs.slice(0, neededAI);
    if (selectedAIs.length < neededAI) {
        var remaining = aiList.filter(function(a) { return !selectedAISet.has(a.name); });
        var pool = remaining.length >= (neededAI - selectedAIs.length) ? remaining : aiList;
        var shuffled = pool.slice();
        for (var i=shuffled.length-1; i>0; i--) {
            var j = rand(0, i);
            var t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t;
        }
        var idx = 0;
        while (selectedAIs.length < neededAI) {
            selectedAIs.push(shuffled[idx % shuffled.length]);
            idx++;
        }
    }
    var playersConfig = [];
    for (var i = 0; i < selectedAIs.length; i++) {
        var ai = selectedAIs[i];
        var aiName = ai.name;
        var suffix = '', counter = 1;
        while (playersConfig.some(function(p) { return p.name === aiName + suffix; })) suffix = '_' + (counter++);
        aiName += suffix;
        playersConfig.push({
            human: false, name: aiName, color: ai.color || '#888',
            Agg: ai.Agg, Soc: ai.Soc, Cau: ai.Cau, Tech: ai.Tech, Exp: ai.Exp
        });
    }
    zoomLevel = 1.0;
    diploPaused = false;
    simulationPaused = false;
    selectedInfoPlayer = -1;
    tutorial.active = false;
    tutorial.step = 0;
    document.getElementById('logBox').innerHTML = '【AI 模拟】开始';
    if (window._resizeHandler) {
        window.removeEventListener('resize', window._resizeHandler);
        window._resizeHandler = null;
    }
    G = new Game(W, H, playersConfig, R);
    G.pendingConfirm = false;
    G.simulationMode = true;
    document.getElementById('pauseBtn').style.display = '';
    document.getElementById('pauseBtn').textContent = '⏸ 暂停';
    document.getElementById('pauseBtn').classList.remove('paused');
    document.getElementById('game').classList.add('active');
    document.getElementById('setup').style.display = 'none';
    renderGame();
    setFeedback('🤖 AI 模拟中...', 'info');
    document.getElementById('actionDelayDisplay').textContent = document.getElementById('actionDelaySlider').value;
    document.getElementById('combatDelayDisplay').textContent = document.getElementById('combatDelaySlider').value;
    window._resizeHandler = function() { renderGame(); };
    window.addEventListener('resize', window._resizeHandler);
    G.autoPlay().then(function() { renderGame(); });
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('tutorialBtn').addEventListener('click', startTutorial);
document.getElementById('simulationBtn').addEventListener('click', startAISimulation);
document.getElementById('resetBtn').addEventListener('click', function() {
    if (G) G.finished = true;
    G = null;
    zoomLevel = 1.0;
    diploPaused = false;
    simulationPaused = false;
    selectedInfoPlayer = -1;
    tutorial.active = false;
    tutorial.step = 0;
    document.getElementById('game').classList.remove('active');
    document.getElementById('setup').style.display = 'block';
    document.getElementById('logBox').innerHTML = '';
    document.getElementById('tutorialPanel').classList.remove('visible');
    document.getElementById('pauseBtn').style.display = 'none';
    highlightElement(null);
    setFeedback('', 'info');
    if (window._resizeHandler) {
        window.removeEventListener('resize', window._resizeHandler);
        window._resizeHandler = null;
    }
    updateContinueButton();
});
document.getElementById('playerCnt').addEventListener('change', updateSelectedCount);
document.getElementById('actionDelaySlider').addEventListener('input', function() {
    document.getElementById('actionDelayDisplay').textContent = this.value;
});
document.getElementById('combatDelaySlider').addEventListener('input', function() {
    document.getElementById('combatDelayDisplay').textContent = this.value;
});

initAIList();
updateSelectedCount();
updateContinueButton();

window.addEventListener('load', function() {
    if (!localStorage.getItem('squareWarTutorialSeen')) {
        localStorage.setItem('squareWarTutorialSeen', '1');
        setTimeout(startTutorial, 200);
    }
});
</script>
