<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>方格纸上的战争</title>
<style>
html { -webkit-text-size-adjust: 100%; -moz-text-size-adjust: 100%; text-size-adjust: 100%; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1e2a; color: #c8d0e0; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
#app { max-width: 1400px; width: 100%; background: #232837; border-radius: 24px; padding: 24px; }
.panel { background: #2a3142; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.panel h3 { font-weight: 400; margin-bottom: 12px; color: #7f8bb3; }
label { display: inline-block; margin-right: 16px; }
input, button { background: #1e2537; color: #e0e8f0; border: 1px solid #3d465a; border-radius: 8px; padding: 6px 12px; font-size: 0.9rem; }
button { background: #3a4a6a; cursor: pointer; transition: 0.2s; }
button:hover { background: #4f6290; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
input[type="range"] { padding: 0; }
.flex { display: flex; gap: 20px; flex-wrap: wrap; }
.col { flex: 1; min-width: 280px; }

.main-title-wrap { text-align: center; padding: 8px 0 24px; border-bottom: 1px solid #3d465a; margin-bottom: 20px; }
.main-title { font-size: 2.4rem; font-weight: 700; letter-spacing: 6px; color: #ffdd4a; text-shadow: 0 0 20px rgba(255,221,74,0.45), 0 0 40px rgba(255,221,74,0.2); margin-bottom: 10px; }
.main-subtitle { font-size: 0.82rem; color: #7f8bb3; letter-spacing: 1px; }
.main-subtitle a { color: #4a9eff; text-decoration: none; border-bottom: 1px dashed #4a9eff; transition: color 0.2s; }
.main-subtitle a:hover { color: #ffdd4a; border-bottom-color: #ffdd4a; }

#aiTable { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
#aiTable th, #aiTable td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #3d465a; }
#aiTable th { background: #1e2537; }
.color-preview { display: inline-block; width: 20px; height: 20px; border-radius: 4px; border: 1px solid #555; vertical-align: middle; }
.ai-actions button { background: none; border: none; color: #aab3d0; cursor: pointer; }
.ai-actions button:hover { color: #fff; }

.modal { display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
.modal.visible { display: flex; }
.modal-content { background: #2a3142; padding: 24px; border-radius: 16px; max-width: 480px; width: 90%; max-height: 90vh; overflow-y: auto; }
.modal-content label { display: block; margin: 8px 0 4px; }
.modal-content input[type="text"], .modal-content input[type="color"] { width: 100%; }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input[type="range"] { flex: 1; }
.range-row span { min-width: 30px; text-align: center; }
.modal-actions { display: flex; gap: 12px; margin-top: 16px; justify-content: flex-end; }
.config-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.config-actions input[type="file"] { display: none; }

#game { display: none; }
#game.active { display: block; }

#statusBar { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 12px; background: #1e2537; border-radius: 8px; margin-bottom: 16px; }
.status-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; background: #2a3142; padding: 4px 10px; border-radius: 6px; border: 2px solid transparent; transition: border-color 0.2s, box-shadow 0.2s; }
.status-color { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid #555; }
.status-name { font-weight: bold; }
.status-detail { color: #aab3d0; }
.you-tag { background: #3a5a7a; padding: 0 6px; border-radius: 4px; font-size: 0.7rem; }

.delay-control { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
.delay-control label { font-size: 0.9rem; margin-right: 4px; }
.delay-control input[type="range"] { width: 100px; }
.delay-control span { min-width: 32px; text-align: center; }
.zoom-hint { font-size: 0.75rem; color: #7f8bb3; margin-left: 8px; }

.log { background: #1a1e2a; border-radius: 8px; padding: 8px 12px; max-height: 320px; overflow-y: auto; font-size: 0.8rem; font-family: monospace; white-space: pre-wrap; line-height: 1.35; }

.grid-wrap { overflow: auto; max-height: 600px; background: #1a1e2a; border-radius: 12px; position: relative; display: block; padding: 4px; user-select: none; touch-action: none; cursor: grab; }
.grid-wrap.panning { cursor: grabbing; }
table { border-collapse: collapse; margin: 0 auto; }
td { width: 36px; height: 36px; text-align: center; border: 1px solid #3d465a; font-size: 11px; transition: 0.1s; background-clip: padding-box; position: relative; overflow: hidden; }
td.owned { font-weight: bold; color: #111; text-shadow: 0 0 4px rgba(255,255,255,0.3); }
td.capital { box-shadow: inset 0 0 0 1px #3a5a7a; cursor: pointer; }
td.capital:hover { filter: brightness(1.2); }

.dist-label { position: absolute; bottom: 0; left: 1px; line-height: 1; color: #d8e0f0; opacity: 0.95; pointer-events: none; font-weight: bold; text-shadow: 0 0 2px #000, 0 0 3px #000; white-space: nowrap; }
.prob-label { position: absolute; bottom: 0; right: 1px; line-height: 1; color: #4caf50; pointer-events: none; font-weight: bold; text-shadow: 0 0 2px #000, 0 0 3px #000; white-space: nowrap; }

.action-menu { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.action-menu .main-btn { background: #3a4a6a; min-width: 70px; }
.action-menu .sub-btn { background: #2a3a5a; font-size: 0.8rem; padding: 4px 8px; }
.action-menu .sub-btn:hover { background: #4a6a8a; }
.feedback { font-size: 1.2rem; font-weight: bold; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; min-height: 3rem; transition: opacity 0.5s; }
.feedback.success { color: #4caf50; background: #1e3a1e; }
.feedback.fail { color: #f44336; background: #3a1e1e; }
.feedback.info { color: #ffdd4a; background: #3a3a1e; }

#eventPopup { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); border: 2px solid #ffdd4a; border-radius: 16px; padding: 16px 28px; z-index: 200; display: none; max-width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.8); font-size: 1.2rem; font-weight: bold; color: #fff; pointer-events: none; }
#eventPopup.show { display: block; animation: popIn 0.3s ease; }
@keyframes popIn { from { opacity: 0; transform: translateX(-50%) scale(0.8); } to { opacity: 1; transform: translateX(-50%) scale(1); } }

#diploModal .modal-content { max-width: 420px; text-align: center; border: 2px solid #ffdd4a; box-shadow: 0 8px 40px rgba(255,221,74,0.15); }
#diploModal h3 { color: #ffdd4a; margin-bottom: 16px; font-size: 1.15rem; letter-spacing: 1px; }
#diploModal .diplo-msg { font-size: 1rem; margin-bottom: 24px; line-height: 1.7; color: #c8d0e0; }
#diploModal .diplo-accept { background: #2d6a4f; min-width: 90px; font-weight: bold; }
#diploModal .diplo-accept:hover { background: #40916c; }
#diploModal .diplo-reject { background: #6a2d2d; min-width: 90px; font-weight: bold; }
#diploModal .diplo-reject:hover { background: #914040; }

#exitModal .modal-content { max-width: 460px; text-align: center; border: 2px solid #ffdd4a; box-shadow: 0 8px 40px rgba(255,221,74,0.15); }
#exitModal h3 { color: #ffdd4a; margin-bottom: 16px; font-size: 1.15rem; letter-spacing: 1px; }
#exitModal .exit-msg { font-size: 1rem; margin-bottom: 24px; line-height: 1.7; color: #c8d0e0; }
#exitModal .exit-save { background: #2d6a4f; min-width: 110px; font-weight: bold; }
#exitModal .exit-save:hover:not(:disabled) { background: #40916c; }
#exitModal .exit-save:disabled { opacity: 0.45; cursor: not-allowed; }
#exitModal .exit-nosave { background: #6a2d2d; min-width: 110px; }
#exitModal .exit-nosave:hover { background: #914040; }
#exitModal .exit-cancel { background: #3a4a6a; min-width: 80px; }
#exitModal .exit-cancel:hover { background: #4f6290; }

#styledModal .modal-content { max-width: 440px; text-align: center; border: 2px solid #ffdd4a; box-shadow: 0 8px 40px rgba(255,221,74,0.15); }
#styledModal h3 { color: #ffdd4a; margin-bottom: 16px; font-size: 1.05rem; letter-spacing: 1px; }
#styledModal .styled-msg { font-size: 0.95rem; margin-bottom: 24px; line-height: 1.7; color: #c8d0e0; white-space: pre-wrap; }
#styledModal .styled-primary { background: #3a4a6a; min-width: 100px; font-weight: bold; }
#styledModal .styled-primary:hover { background: #4f6290; }

#saveSlotModal .modal-content { max-width: 640px; border: 2px solid #ffdd4a; box-shadow: 0 8px 40px rgba(255,221,74,0.15); }
#saveSlotModal h3 { color: #ffdd4a; margin-bottom: 16px; font-size: 1.15rem; letter-spacing: 1px; text-align: center; }
#saveSlotsList { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding: 4px; }
.save-slot { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #1e2537; border-radius: 10px; border: 1px solid #3d465a; transition: border-color 0.2s; }
.save-slot:hover { border-color: #4f6290; }
.save-slot.empty { opacity: 0.65; }
.save-slot.current { border-color: #ffdd4a; box-shadow: 0 0 8px rgba(255,221,74,0.3); }
.save-slot .slot-num { font-weight: bold; color: #ffdd4a; font-size: 0.9rem; min-width: 44px; }
.save-slot .slot-info { flex: 1; font-size: 0.82rem; line-height: 1.5; color: #c8d0e0; }
.save-slot .slot-info .slot-meta { color: #7f8bb3; font-size: 0.75rem; }
.save-slot .slot-actions { display: flex; gap: 6px; flex-shrink: 0; }
.save-slot .slot-actions button { padding: 4px 10px; font-size: 0.78rem; }
.save-slot .slot-actions .slot-save { background: #2d6a4f; }
.save-slot .slot-actions .slot-save:hover:not(:disabled) { background: #40916c; }
.save-slot .slot-actions .slot-save:disabled { opacity: 0.4; cursor: not-allowed; }
.save-slot .slot-actions .slot-load { background: #3a4a6a; }
.save-slot .slot-actions .slot-load:hover:not(:disabled) { background: #4f6290; }
.save-slot .slot-actions .slot-load:disabled { opacity: 0.4; cursor: not-allowed; }
.save-slot .slot-actions .slot-del { background: #6a2d2d; }
.save-slot .slot-actions .slot-del:hover { background: #914040; }

#pauseBtn { background: #8a6a2a; }
#pauseBtn:hover { background: #aa8a3a; }
#pauseBtn.paused { background: #2d6a4f; }
#pauseBtn.paused:hover { background: #40916c; }

#difficultySlider { width: 180px; }
#difficultyLabel { display: inline-block; min-width: 48px; text-align: center; color: #ffdd4a; font-weight: bold; }

#tutorialBtn { background: #4a6a8a; }
#tutorialBtn:hover { background: #5a7a9a; }
#simulationBtn { background: #5a4a8a; }
#simulationBtn:hover { background: #6a5a9a; }
#manageSaveBtn { background: #3a5a4a; }
#manageSaveBtn:hover { background: #4a7a5a; }

#saveBtn { background: #4a6a3a; }
#saveBtn:hover { background: #5a8a4a; }
#exitBtn { background: #6a3a3a; }
#exitBtn:hover { background: #8a4a4a; }

#tutorialHighlight { position: fixed; border: 3px solid #ffdd4a; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.55), 0 0 20px #ffdd4a; z-index: 399; pointer-events: none; transition: left 0.25s, top 0.25s, width 0.25s, height 0.25s; display: none; }

#tutorialPanel { border: 2px solid #ffdd4a !important; background: rgba(30, 37, 55, 0.98) !important; display: none; }
#tutorialPanel.visible { display: block; }
#tutorialPanel .tut-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
#tutorialPanel .tut-title { color: #ffdd4a; font-size: 1rem; font-weight: bold; }
#tutorialPanel .tut-progress { font-size: 0.72rem; color: #7f8bb3; }
#tutorialPanel .tut-text { font-size: 0.85rem; line-height: 1.7; color: #c8d0e0; margin-bottom: 12px; white-space: pre-wrap; }
#tutorialPanel .tut-text b { color: #ffdd4a; }
#tutorialPanel .tut-actions { display: flex; justify-content: flex-end; gap: 10px; }
#tutorialPanel .tut-next { background: #2d6a4f; min-width: 110px; font-weight: bold; }
#tutorialPanel .tut-next:hover:not(:disabled) { background: #40916c; }
#tutorialPanel .tut-next:disabled { opacity: 0.55; cursor: not-allowed; }
#tutorialPanel .tut-skip { background: #6a2d2d; }
#tutorialPanel .tut-skip:hover { background: #914040; }

.tut-progress-tag { border: 2px solid #ffdd4a !important; background: #3a3a1e !important; }
.tut-progress-tag .tut-tag-title { color: #ffdd4a; font-weight: bold; }

@media (max-width: 700px) { .col { min-width: 100%; } .main-title { font-size: 1.6rem; letter-spacing: 3px; } }
</style>
</head>
<body>
<div id="app">
    <div id="setup" class="panel">
        <div class="main-title-wrap">
            <h1 class="main-title">方格纸上的战争</h1>
            <p class="main-subtitle">开发者：<a href="https://psn.mgdz.deno.net" target="_blank" rel="noopener">Mangod_Zhang（MGDZ）</a></p>
        </div>
        <h3>⚙️ 游戏设置</h3>
        <div class="flex">
            <div class="col">
                <label>地图宽 <input type="number" id="mapW" value="10" min="4" max="50"></label>
                <label>地图高 <input type="number" id="mapH" value="10" min="4" max="50"></label>
                <label>玩家数 <input type="number" id="playerCnt" value="4" min="2" max="10"></label>
            </div>
            <div class="col">
                <label>你的名字 <input type="text" id="playerName" value="Player" pattern="[A-Za-z0-9_]+"></label>
                <label>你的颜色 <input type="color" id="playerColor" value="#e74c3c"></label>
            </div>
            <div class="col">
                <label>难度
                    <input type="range" id="difficultySlider" min="0" max="1" step="0.01" value="0.5" list="difficultyTicks">
                    <span id="difficultyLabel">普通</span>
                </label>
                <datalist id="difficultyTicks">
                    <option value="0"></option>
                    <option value="0.25"></option>
                    <option value="0.5"></option>
                    <option value="0.75"></option>
                    <option value="1"></option>
                </datalist>
                <div style="margin-top:8px;">
                    <button id="startBtn">开始游戏</button>
                    <button id="tutorialBtn">新手教程</button>
                    <button id="simulationBtn">🤖 AI 模拟</button>
                    <button id="manageSaveBtn">💾 存档管理</button>
                    <button id="resetBtn">重置</button>
                </div>
            </div>
        </div>
        <div style="margin-top:20px; border-top:1px solid #3d465a; padding-top:16px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h4 style="margin:0;">🤖 AI角色列表</h4>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button id="addAI">+ 自定义</button>
                    <button id="randomSelect">随机勾选</button>
                    <button id="randomFromSelected">从已选随机</button>
                    <button id="clearSelect">清空勾选</button>
                </div>
            </div>
            <div style="max-height:200px; overflow-y:auto; margin-top:8px;">
                <table id="aiTable">
                    <thead><tr><th>选择</th><th>名称</th><th>描述</th><th>颜色</th><th>操作</th></tr></thead>
                    <tbody id="aiTableBody"></tbody>
                </table>
            </div>
            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; margin-top:8px;">
                <span id="selectedCount">已选 0</span>
                <span>需要 <span id="neededCount">0</span> 个AI</span>
                <div class="config-actions">
                    <button id="exportConfig">导出配置</button>
                    <button id="importBtn">导入配置</button>
                    <input type="file" id="importFile" accept=".json">
                </div>
            </div>
        </div>
    </div>

    <div id="game">
        <div id="statusBar"></div>
        <div class="delay-control">
            <label>行动间隔</label>
            <input type="range" id="actionDelaySlider" min="0.1" max="3" step="0.1" value="0.8">
            <span id="actionDelayDisplay">0.8</span>
            <label>战斗间隔</label>
            <input type="range" id="combatDelaySlider" min="0.05" max="2" step="0.05" value="0.2">
            <span id="combatDelayDisplay">0.2</span>
            <label style="margin-left:8px; font-size:0.85rem;"><input type="checkbox" id="mergeOwnWarsCheckbox" style="margin-right:4px;">合并自己的战争</label>
            <button id="saveBtn" style="margin-left:8px;">💾 存档</button>
            <button id="pauseBtn" style="margin-left:4px; display:none;">⏸ 暂停</button>
            <button id="exitBtn" style="margin-left:4px;">🚪 退出</button>
            <span style="margin-left:auto; font-size:1rem;">回合 <span id="turnDisplay">0</span></span>
            <span class="zoom-hint">滚轮/双指缩放 · 拖动平移 · 缩放 <span id="zoomDisplay">100%</span></span>
        </div>
        <div id="feedbackArea" class="feedback info">准备就绪</div>
        <div class="flex">
            <div class="col" style="flex:2; position:relative;">
                <div class="panel">
                    <h3>战场</h3>
                    <div class="grid-wrap" id="mapContainer"></div>
                </div>
            </div>
            <div class="col" style="flex:1;">
                <div class="panel">
                    <h3>操作</h3>
                    <div id="actionPanel">
                        <div class="action-menu" id="mainMenu"></div>
                        <div id="subMenu" style="margin-top:8px;"></div>
                    </div>
                </div>
                <div class="panel">
                    <h3>战报</h3>
                    <div class="log" id="logBox">游戏开始</div>
                </div>
                <div class="panel" id="tutorialPanel">
                    <div class="tut-header">
                        <span class="tut-title"></span>
                        <span class="tut-progress"></span>
                    </div>
                    <div class="tut-text"></div>
                    <div class="tut-actions">
                        <button class="tut-skip" id="tutSkipBtn">退出教程</button>
                        <button class="tut-next" id="tutNextBtn">下一步 →</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="eventPopup"></div>

<div class="modal" id="diploModal">
    <div class="modal-content">
        <h3>📜 外交请求</h3>
        <p class="diplo-msg"></p>
        <div class="modal-actions" style="justify-content: center; gap: 16px;">
            <button class="diplo-accept">✓ 接受</button>
            <button class="diplo-reject">✗ 拒绝</button>
        </div>
    </div>
</div>

<div class="modal" id="aiModal">
    <div class="modal-content">
        <h3>自定义AI</h3>
        <label>名称 <input type="text" id="newAIName" placeholder="仅英文数字下划线"></label>
        <label>描述 <input type="text" id="newAIDesc"></label>
        <label>颜色 <input type="color" id="newAIColor" value="#3498db"></label>
        <label>侵略性 (Agg) <div class="range-row"><input type="range" id="newAIAgg" min="0" max="1" step="0.01" value="0.5"><span id="newAIAggVal">0.50</span></div></label>
        <label>社交性 (Soc) <div class="range-row"><input type="range" id="newAISoc" min="0" max="1" step="0.01" value="0.5"><span id="newAISocVal">0.50</span></div></label>
        <label>谨慎度 (Cau) <div class="range-row"><input type="range" id="newAICau" min="0" max="1" step="0.01" value="0.5"><span id="newAICauVal">0.50</span></div></label>
        <label>科技欲 (Tech) <div class="range-row"><input type="range" id="newAITech" min="0" max="1" step="0.01" value="0.5"><span id="newAITechVal">0.50</span></div></label>
        <label>扩张欲 (Exp) <div class="range-row"><input type="range" id="newAIExp" min="0" max="1" step="0.01" value="0.5"><span id="newAIExpVal">0.50</span></div></label>
        <div class="modal-actions">
            <button id="modalCancel">取消</button>
            <button id="modalConfirm">确定</button>
        </div>
    </div>
</div>

<div class="modal" id="exitModal">
    <div class="modal-content">
        <h3>🚪 退出游戏</h3>
        <p class="exit-msg">是否保存当前进度？</p>
        <div class="modal-actions" style="justify-content: center; gap: 12px; flex-wrap: wrap;">
            <button class="exit-cancel" id="exitCancelBtn">取消</button>
            <button class="exit-nosave" id="exitNoSaveBtn">不保存退出</button>
            <button class="exit-save" id="exitSaveBtn">保存并退出</button>
        </div>
    </div>
</div>

<div class="modal" id="saveSlotModal">
    <div class="modal-content">
        <h3>💾 存档管理</h3>
        <div id="saveSlotsList"></div>
        <div class="modal-actions" style="justify-content: center; margin-top: 20px;">
            <button id="saveSlotCloseBtn" style="min-width: 100px;">关闭</button>
        </div>
    </div>
</div>

<div class="modal" id="styledModal">
    <div class="modal-content">
        <h3 id="styledModalTitle">提示</h3>
        <p class="styled-msg" id="styledModalMsg"></p>
        <div class="modal-actions" style="justify-content: center;">
            <button class="styled-primary" id="styledModalOk">确定</button>
        </div>
    </div>
</div>

<div id="tutorialHighlight"></div>

<script>
// =====================================================================
// 工具函数
// =====================================================================
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
function manhattan(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }
function remoteHitProb(d, D) {
    if (D <= 0) return d === 0 ? 1 : 0;
    var prob = (D + 1 - d) / (D + 1);
    return Math.max(0, Math.min(1, prob));
}
function cname(p) {
    if (!p) return '';
    return '<span style="color:' + p.color + '; font-weight:bold;">' + p.name + '</span>';
}

var QUANTILE_TABLE = {
    'expand':           { p10: 5,  p25: 10, p50: 20,  p75: 35,  p90: 165 },
    'recruit':          { p10: 8,  p25: 25, p50: 55,  p75: 95,  p90: 150 },
    'research_attack':  { p10: 8,  p25: 20, p50: 45,  p75: 85,  p90: 140 },
    'research_defense': { p10: 8,  p25: 20, p50: 45,  p75: 85,  p90: 140 },
    'ally':             { p10: 15, p25: 35, p50: 65,  p75: 110, p90: 180 },
    'war':              { p10: 0,  p25: 0,  p50: 15,  p75: 50,  p90: 100 },
    'unally':           { p10: 40, p25: 70, p50: 110, p75: 170, p90: 250 },
    'peace':            { p10: 0,  p25: 0,  p50: 15,  p75: 45,  p90: 80 }
};

function estimatePercentile(rawScore, actionType) {
    var q = QUANTILE_TABLE[actionType];
    if (!q) return 0.5;
    var s = Math.max(0, rawScore);
    if (s <= q.p10) return 0.10 * (s / (q.p10 || 1));
    if (s <= q.p25) return 0.10 + 0.15 * (s - q.p10) / (q.p25 - q.p10);
    if (s <= q.p50) return 0.25 + 0.25 * (s - q.p25) / (q.p50 - q.p25);
    if (s <= q.p75) return 0.50 + 0.25 * (s - q.p50) / (q.p75 - q.p50);
    if (s <= q.p90) return 0.75 + 0.15 * (s - q.p75) / (q.p90 - q.p75);
    return 0.90 + 0.10 * Math.min(1, (s - q.p90) / Math.max(q.p90, 1));
}

var aiList = [];
var selectedAISet = new Set();
var nextCustomId = 1000;

function loadAIList() {
    try {
        var saved = localStorage.getItem('myAIData');
        if (saved) {
            var parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
                var initialNames = new Set(INITIAL_AIS.map(function(a) { return a.name; }));
                for (var k = 0; k < parsed.length; k++) {
                    var a = parsed[k];
                    if (a.isCustom === undefined) a.isCustom = !initialNames.has(a.name);
                    if (a.id === undefined) a.id = a.isCustom ? 'custom_' + (nextCustomId++) : a.name;
                }
                return parsed;
            }
        }
    } catch(e) { console.warn('读取存储失败', e); }
    return INITIAL_AIS.map(function(a) { var c = {}; for (var k in a) c[k] = a[k]; c.isCustom = false; c.id = a.name; return c; });
}

function saveAIList() {
    var toSave = aiList.map(function(a) {
        return {
            name: a.name, desc: a.desc, color: a.color,
            Agg: a.Agg, Soc: a.Soc, Cau: a.Cau, Tech: a.Tech, Exp: a.Exp,
            isCustom: a.isCustom
        };
    });
    localStorage.setItem('myAIData', JSON.stringify(toSave));
}

function initAIList() {
    aiList = loadAIList();
    if (!aiList || aiList.length === 0) {
        aiList = INITIAL_AIS.map(function(a) { var c = {}; for (var k in a) c[k] = a[k]; c.isCustom = false; c.id = a.name; return c; });
        saveAIList();
    }
    var maxId = aiList.reduce(function(max, a) {
        if (a.isCustom && a.id && a.id.indexOf('custom_') === 0) {
            var num = parseInt(a.id.split('_')[1]);
            return Math.max(max, num);
        }
        return max;
    }, 1000);
    nextCustomId = maxId + 1;
    selectedAISet.clear();
    renderAIList();
}

function renderAIList() {
    var tbody = document.getElementById('aiTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';
    for (var i = 0; i < aiList.length; i++) {
        var ai = aiList[i];
        var checked = selectedAISet.has(ai.name) ? 'checked' : '';
        var colorStyle = ai.color ? 'background:' + ai.color + ';' : '';
        var row = document.createElement('tr');
        row.innerHTML =
            '<td><input type="checkbox" class="ai-check" data-name="' + ai.name + '" ' + checked + '></td>' +
            '<td>' + ai.name + '</td>' +
            '<td>' + ai.desc + '</td>' +
            '<td><span class="color-preview" style="' + colorStyle + '"></span></td>' +
            '<td class="ai-actions">' + (ai.isCustom ? '<button class="del-ai" data-name="' + ai.name + '">删除</button>' : '') + '</td>';
        tbody.appendChild(row);
    }
    tbody.querySelectorAll('.ai-check').forEach(function(cb) {
        cb.addEventListener('change', function() {
            var name = this.dataset.name;
            if (this.checked) selectedAISet.add(name);
            else selectedAISet.delete(name);
            updateSelectedCount();
        });
    });
    tbody.querySelectorAll('.del-ai').forEach(function(btn) {
        btn.addEventListener('click', function() { deleteAI(this.dataset.name); });
    });
    updateSelectedCount();
}

function updateSelectedCount() {
    var cnt = selectedAISet.size;
    var needed = Math.max(0, parseInt(document.getElementById('playerCnt').value) - 1);
    document.getElementById('selectedCount').textContent = '已选 ' + cnt;
    document.getElementById('neededCount').textContent = needed;
}

function deleteAI(name) {
    if (!confirm('删除AI "' + name + '"？')) return;
    var idx = aiList.findIndex(function(a) { return a.name === name; });
    if (idx === -1) return;
    if (!aiList[idx].isCustom) { alert('不能删除初始AI'); return; }
    aiList.splice(idx, 1);
    selectedAISet.delete(name);
    saveAIList();
    renderAIList();
}

function addCustomAI(name, desc, color, Agg, Soc, Cau, Tech, Exp) {
    if (aiList.some(function(a) { return a.name === name; })) { alert('名称已存在'); return false; }
    aiList.push({ name: name, desc: desc, color: color, Agg: Agg, Soc: Soc, Cau: Cau, Tech: Tech, Exp: Exp, isCustom: true, id: 'custom_' + (nextCustomId++) });
    saveAIList();
    renderAIList();
    return true;
}

function randomSelect(count) {
    var available = aiList.filter(function(a) { return !selectedAISet.has(a.name); });
    if (available.length === 0) return;
    var needed = Math.min(count, available.length);
    var shuffled = available.slice();
    for (var i = shuffled.length-1; i>0; i--) {
        var j = rand(0, i);
        var t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t;
    }
    for (var k=0; k<needed; k++) selectedAISet.add(shuffled[k].name);
    renderAIList();
}

function randomFromSelected(count) {
    var selected = aiList.filter(function(a) { return selectedAISet.has(a.name); });
    if (selected.length === 0) return;
    var needed = Math.min(count, selected.length);
    var shuffled = selected.slice();
    for (var i = shuffled.length-1; i>0; i--) {
        var j = rand(0, i);
        var t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t;
    }
    selectedAISet.clear();
    for (var k=0; k<needed; k++) selectedAISet.add(shuffled[k].name);
    renderAIList();
}

function exportConfig() {
    var data = JSON.stringify(aiList, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ai_config.json';
    a.click();
    URL.revokeObjectURL(url);
}

function importConfig(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var imported = JSON.parse(e.target.result);
            if (!Array.isArray(imported)) throw new Error('格式错误');
            for (var k = 0; k < imported.length; k++) {
                var a = imported[k];
                if (typeof a.name !== 'string' || typeof a.Agg !== 'number') throw new Error('字段不完整');
            }
            var initialNames = new Set(INITIAL_AIS.map(function(a) { return a.name; }));
            var newList = imported.map(function(a) {
                var isInit = initialNames.has(a.name);
                var c = {}; for (var kk in a) c[kk] = a[kk];
                c.isCustom = !isInit;
                c.id = isInit ? a.name : ('custom_' + (nextCustomId++));
                return c;
            });
            aiList = newList;
            selectedAISet.clear();
            saveAIList();
            renderAIList();
            alert('导入成功');
        } catch(err) { alert('导入失败：' + err.message); }
    };
    reader.readAsText(file);
}

var SAVE_SLOT_COUNT = 10;
var SAVE_SLOT_PREFIX = 'squareWarSave_slot_';

function getSlotKey(idx) { return SAVE_SLOT_PREFIX + idx; }

function readSlot(idx) {
    try {
        var raw = localStorage.getItem(getSlotKey(idx));
        if (!raw) return null;
        return JSON.parse(raw);
    } catch(e) { return null; }
}

function writeSlot(idx, data) {
    try {
        localStorage.setItem(getSlotKey(idx), JSON.stringify(data));
        return true;
    } catch(e) {
        alert('存档失败：' + e.message);
        return false;
    }
}

function deleteSlot(idx) {
    localStorage.removeItem(getSlotKey(idx));
}

function showSaveSlotModal(isSaving) {
    var modal = document.getElementById('saveSlotModal');
    renderSaveSlots(isSaving);
    modal.classList.add('visible');
}

function renderSaveSlots(isSaving) {
    var list = document.getElementById('saveSlotsList');
    list.innerHTML = '';
    var canSaveNow = isSaving && G && !G.finished && !tutorial.active;
    for (var i = 0; i < SAVE_SLOT_COUNT; i++) {
        var slot = readSlot(i);
        var div = document.createElement('div');
        div.className = 'save-slot' + (slot ? '' : ' empty');

        var infoHtml;
        if (slot) {
            var timeStr = new Date(slot.savedAt).toLocaleString();
            var modeTag = slot.simulationMode ? '<span style="color:#a890ff;">[AI模拟]</span> ' : '';
            infoHtml =
                '<div>' + modeTag + '回合 ' + slot.turn + ' · ' + slot.aliveCount + '人存活</div>' +
                '<div class="slot-meta">' + timeStr + '</div>';
        } else {
            infoHtml = '<div class="slot-meta">空槽位</div>';
        }

        var actionsHtml = '';
        if (canSaveNow) {
            actionsHtml += '<button class="slot-save" data-slot="' + i + '" data-action="save">保存到此</button>';
        }
        if (slot) {
            actionsHtml += '<button class="slot-load" data-slot="' + i + '" data-action="load">读取</button>';
            actionsHtml += '<button class="slot-del" data-slot="' + i + '" data-action="del">删除</button>';
        }

        div.innerHTML =
            '<div class="slot-num">槽 ' + (i + 1) + '</div>' +
            '<div class="slot-info">' + infoHtml + '</div>' +
            '<div class="slot-actions">' + actionsHtml + '</div>';

        list.appendChild(div);
    }

    list.querySelectorAll('button[data-action]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var slotIdx = parseInt(this.dataset.slot);
            var action = this.dataset.action;
            if (action === 'save') doSaveToSlot(slotIdx);
            else if (action === 'load') doLoadFromSlot(slotIdx);
            else if (action === 'del') {
                if (confirm('确定删除槽 ' + (slotIdx + 1) + ' 的存档？')) {
                    deleteSlot(slotIdx);
                    renderSaveSlots(isSaving);
                    updateContinueButton();
                }
            }
        });
    });
}

document.getElementById('saveSlotCloseBtn').addEventListener('click', function() {
    document.getElementById('saveSlotModal').classList.remove('visible');
});

function doSaveToSlot(slotIdx) {
    if (!G) { showStyledAlert('提示', '没有正在进行的游戏'); return; }
    if (G.finished) { showStyledAlert('提示', '游戏已结束，无需存档'); return; }
    if (tutorial.active) { showStyledAlert('提示', '教程模式不能存档'); return; }
    if (!G.simulationMode && !G.waitingForHuman) {
        showStyledAlert('提示', '请等待 AI 回合结束后再存档');
        return;
    }
    var existing = readSlot(slotIdx);
    if (existing) {
        if (!confirm('槽 ' + (slotIdx + 1) + ' 已有存档，确定覆盖？')) return;
    }
    try {
        var data = {
            version: 1,
            savedAt: Date.now(),
            turn: G.turn,
            aliveCount: G.players.filter(function(p) { return p.alive; }).length,
            simulationMode: !!G.simulationMode,
            logHTML: document.getElementById('logBox').innerHTML,
            state: G.serialize()
        };
        if (writeSlot(slotIdx, data)) {
            setFeedback('💾 已保存到槽 ' + (slotIdx + 1), 'success');
            renderSaveSlots(true);
            updateContinueButton();
        }
    } catch(e) {
        showStyledAlert('存档失败', e.message);
    }
}

function doLoadFromSlot(slotIdx) {
    var slot = readSlot(slotIdx);
    if (!slot || !slot.state) { showStyledAlert('提示', '该槽位为空'); return; }
    if (G && !G.finished) {
        if (!confirm('当前游戏未保存，确定读取槽 ' + (slotIdx + 1) + ' 吗？')) return;
    }
    if (G) G.finished = true;
    tutorial.active = false;
    tutorial.step = 0;
    diploPaused = false;
    simulationPaused = false;
    selectedInfoPlayer = -1;
    zoomLevel = 1.0;
    if (window._resizeHandler) {
        window.removeEventListener('resize', window._resizeHandler);
        window._resizeHandler = null;
    }
    try {
        G = Game.deserialize(slot.state);
        document.getElementById('saveSlotModal').classList.remove('visible');
        document.getElementById('game').classList.add('active');
        document.getElementById('setup').style.display = 'none';
        if (slot.logHTML) {
            document.getElementById('logBox').innerHTML = slot.logHTML;
        } else {
            document.getElementById('logBox').innerHTML = '';
        }
        G.addLog('【读档】槽 ' + (slotIdx + 1) + ' · 于 ' + new Date(slot.savedAt).toLocaleString());

            G.autoPlay().then(function() { renderGame(); });
        }
    } catch(e) {
        showStyledAlert('读档失败', e.message);
    }
}

function updateContinueButton() {
    var btn = document.getElementById('continueBtn');
    if (!btn) return;
    var latestIdx = -1;
    var latestTime = 0;
    for (var i = 0; i < SAVE_SLOT_COUNT; i++) {
        var slot = readSlot(i);
        if (slot && slot.savedAt > latestTime) {
            latestTime = slot.savedAt;
            latestIdx = i;
        }
    }
    if (latestIdx === -1) {
        btn.style.display = 'none';
        return;
    }
    btn.style.display = '';
    var slot = readSlot(latestIdx);
    var timeStr = new Date(slot.savedAt).toLocaleString();
    var modeTag = slot.simulationMode ? '[模拟] ' : '';
    btn.textContent = '继续游戏 ' + modeTag + '（槽' + (latestIdx + 1) + ' · 回合' + slot.turn + ' · ' + slot.aliveCount + '人）';
    btn.onclick = function() { doLoadFromSlot(latestIdx); };
}

function startTutorial() {
    tutorial.active = true;
    tutorial.step = 0;
    tutorial.pendingAdvance = false;
    tutorialForce = { greenAcceptAlliance: true, blueMeleeLose: false, attackResearch5Count: 2, orangeRemoteLose: false };
    diploPaused = false;
    simulationPaused = false;
    selectedInfoPlayer = -1;
    zoomLevel = 1.0;

    var playersConfig = [
        { human: true, name: '你', color: '#e74c3c', Agg:0.5, Soc:0.5, Cau:0.5, Tech:0.5, Exp:0.5 },
        { human: false, name: '蓝色', color: '#3498db', Agg:0.5, Soc:0.5, Cau:0.5, Tech:0.5, Exp:0.5 },
        { human: false, name: '绿色', color: '#27ae60', Agg:0.5, Soc:0.5, Cau:0.5, Tech:0.5, Exp:0.5 },
        { human: false, name: '橙色', color: '#e67e22', Agg:0.5, Soc:0.5, Cau:0.5, Tech:0.5, Exp:0.5 }
    ];

    G = new Game(8, 8, playersConfig, 0.5);

    for (var y=0; y<G.H; y++)
        for (var x=0; x<G.W; x++)
            G.grid[y][x] = { owner: -1, troops: 0, capitalOf: -1 };

    var fixedPositions = [{x:1,y:1},{x:6,y:1},{x:1,y:6},{x:6,y:6}];
    for (var i=0; i<G.players.length; i++) {
        var p = G.players[i];
        var pos = fixedPositions[i];
        p.capital = {x:pos.x, y:pos.y};
        p.territories = [{x:pos.x, y:pos.y}];
        G.grid[pos.y][pos.x].owner = i;
        G.grid[pos.y][pos.x].troops = 100;
        G.grid[pos.y][pos.x].capitalOf = i;
    }

    G.pendingConfirm = false;
    G.waitingForHuman = true;
    G.currentActingPlayer = 0;
    G.simulationMode = false;

    document.getElementById('game').classList.add('active');
    document.getElementById('setup').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'none';
    document.getElementById('logBox').innerHTML = '【教程】开始';

    renderGame();
    showTutorialStep();

    if (window._resizeHandler) window.removeEventListener('resize', window._resizeHandler);
    window._resizeHandler = function() {
        renderGame();
        var step = TUTORIAL_STEPS[tutorial.step];
        if (step && step.highlight) highlightElement(step.highlight);
    };
    window.addEventListener('resize', window._resizeHandler);
}

function showTutorialStep() {
    var step = TUTORIAL_STEPS[tutorial.step];
    if (!step) return;
    var panel = document.getElementById('tutorialPanel');
    panel.querySelector('.tut-title').textContent = step.title;
    panel.querySelector('.tut-text').innerHTML = step.text;
    panel.querySelector('.tut-progress').textContent = '第 ' + (tutorial.step + 1) + ' / ' + TUTORIAL_STEPS.length + ' 步';

    var nextBtn = document.getElementById('tutNextBtn');
    if (step.next === 'manual') { nextBtn.textContent = '下一步 →'; nextBtn.disabled = false; }
    else if (step.next === 'finish') { nextBtn.textContent = '✓ 完成教程'; nextBtn.disabled = false; }
    else if (step.next === 'execute') { nextBtn.textContent = step.action === 'meleeBlue' ? '⚔️ 执行攻击' : '🎯 执行远程攻击'; nextBtn.disabled = false; }
    else { nextBtn.textContent = '等待操作...'; nextBtn.disabled = true; }

    panel.classList.add('visible');
    if (step.highlight) setTimeout(function() { highlightElement(step.highlight); }, 50);
    else highlightElement(null);
}

function nextTutorialStep() {
    tutorial.step++;
    if (tutorial.step >= TUTORIAL_STEPS.length) { exitTutorial(); return; }
    showTutorialStep();
    renderGame();
}

function exitTutorial() {
    tutorial.active = false;
    tutorial.step = 0;
    tutorialForce = { greenAcceptAlliance:false, blueMeleeLose:false, attackResearch5Count:0, orangeRemoteLose:false };
    document.getElementById('tutorialPanel').classList.remove('visible');
    highlightElement(null);
    document.getElementById('logBox').innerHTML = '';
    G = null;
    document.getElementById('game').classList.remove('active');
    document.getElementById('setup').style.display = 'block';
    document.getElementById('pauseBtn').style.display = 'none';
    if (window._resizeHandler) window.removeEventListener('resize', window._resizeHandler);
    updateContinueButton();
}

function highlightElement(selector) {
    var hl = document.getElementById('tutorialHighlight');
    if (!selector) { hl.style.display = 'none'; return; }
    var el = document.querySelector(selector);
    if (!el || el.offsetParent === null) { hl.style.display = 'none'; return; }
    var rect = el.getBoundingClientRect();
    hl.style.display = 'block';
    hl.style.left = (rect.left - 4) + 'px';
    hl.style.top = (rect.top - 4) + 'px';
    hl.style.width = (rect.width + 8) + 'px';
    hl.style.height = (rect.height + 8) + 'px';
}

function checkTutorialConditional() {
    if (!tutorial.active || tutorial.pendingAdvance) return;
    var step = TUTORIAL_STEPS[tutorial.step];
    if (!step || step.next !== 'conditional' || !step.check) return;
    try {
        if (step.check()) {
            tutorial.pendingAdvance = true;
            setTimeout(function() { tutorial.pendingAdvance = false; nextTutorialStep(); }, 600);
        }
    } catch(e) { /* ignore */ }
}

function afterHumanAction(actionType, extra) {
    if (!tutorial.active) {
        G.finishHumanTurnAsync().then(function() { renderGame(); checkHumanEliminated(); });
        return;
    }
    renderGame();
    var step = TUTORIAL_STEPS[tutorial.step];
    if (!step) return;
    if (step.next === 'action') setTimeout(function() { nextTutorialStep(); }, 600);
    else if (!step.allowed) G.finishHumanTurnAsync().then(function() { renderGame(); checkTutorialConditional(); });
    else if (step.next === 'conditional') checkTutorialConditional();
}

function tutorialMeleeBlue() {
    if (!G) return;
    var i = 0, j = 1;
    var border = G.getBorderCells(i, j);
    var captured = 0;
    for (var k = 0; k < border.pid2.length; k++) {
        var pos = border.pid2[k];
        if (G.grid[pos.y][pos.x].owner === j) {
            G.grid[pos.y][pos.x].owner = i;
            G.grid[pos.y][pos.x].troops = 0;
            G.grid[pos.y][pos.x].capitalOf = -1;
            var idx = G.players[j].territories.findIndex(function(t) { return t.x===pos.x && t.y===pos.y; });
            if (idx>=0) G.players[j].territories.splice(idx, 1);
            G.players[i].territories.push({x:pos.x, y:pos.y});
            captured++;
        }
    }
    G.addLog('【教程】近战：你击败了蓝色，夺取 ' + captured + ' 格！');
    showEventPopup('⚔️ 近战获胜，夺取蓝色领土！', 2500);
    if (G.players[j].territories.length === 0) {
        G.players[j].alive = false;
        G.addLog('蓝色 失去全部领土，被淘汰');
        G.clearEliminatedTerritory(j);
    }
    G.ensureCapital(0);
    renderGame();
    setTimeout(function() { nextTutorialStep(); }, 900);
}

function tutorialRemoteOrange() {
    if (!G) return;
    var attacker = 0, defender = 3;
    var D = G.players[attacker].atkRange;
    var attackCapital = G.players[attacker].capital;
    var groups = {};
    for (var k = 0; k < G.players[defender].territories.length; k++) {
        var t = G.players[defender].territories[k];
        var d = manhattan(t, attackCapital);
        if (d <= D) {
            if (!groups[d]) groups[d] = [];
            groups[d].push(t);
        }
    }
    var keys = Object.keys(groups).map(Number).sort(function(a,b) { return a-b; });
    var totalCaptured = 0;
    for (var ki = 0; ki < keys.length; ki++) {
        var d = keys[ki];
        for (var pi = 0; pi < groups[d].length; pi++) {
            var pos = groups[d][pi];
            if (G.grid[pos.y][pos.x].owner === defender) {
                G.grid[pos.y][pos.x].owner = attacker;
                G.grid[pos.y][pos.x].troops = 0;
                G.grid[pos.y][pos.x].capitalOf = -1;
                var idx = G.players[defender].territories.findIndex(function(t) { return t.x===pos.x && t.y===pos.y; });
                if (idx>=0) G.players[defender].territories.splice(idx, 1);
                G.players[attacker].territories.push({x:pos.x, y:pos.y});
                totalCaptured++;
            }
        }
        G.addLog('【教程】远程[距离' + d + ']：你命中橙色的 ' + groups[d].length + ' 格，全部夺取');
    }
    showEventPopup('🎯 远程命中，夺取 ' + totalCaptured + ' 格！', 2500);
    if (G.players[defender].territories.length === 0) {
        G.players[defender].alive = false;
        G.addLog('橙色 失去全部领土，被淘汰');
        G.clearEliminatedTerritory(defender);
    }
    G.ensureCapital(0);
    renderGame();
    setTimeout(function() { nextTutorialStep(); }, 900);
}

document.getElementById('tutNextBtn').addEventListener('click', function() {
    var step = TUTORIAL_STEPS[tutorial.step];
    if (!step) return;
    if (step.next === 'manual') nextTutorialStep();
    else if (step.next === 'execute') {
        if (step.action === 'meleeBlue') tutorialMeleeBlue();
        else if (step.action === 'remoteOrange') tutorialRemoteOrange();
    } else if (step.next === 'finish') exitTutorial();
});
document.getElementById('tutSkipBtn').addEventListener('click', exitTutorial);
